<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Straßenbingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#0e1217; --panel:#161c24; --panel2:#1f2833; --line:#2a3542; --text:#e8edf3; --muted:#8e9bab;
  --accent:#ffb020; --accent-ink:#1d1400; --paper:#f6efdf; --paper2:#ebe2cc; --ink:#22252c;
  --t0:#ff5d4f; --t1:#22b4c3; --ok:#35c873; --bad:#ff5d6c; --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--text); font:15px/1.45 'DM Sans',system-ui,sans-serif;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;
}
h1,h2,h3,.display{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.01em;margin:0}
h2{font-size:18px;margin-bottom:12px}
a{color:var(--accent)}
button,.btnlike{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:9px 14px;background:var(--panel2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
button:hover:not(:disabled),.btnlike:hover{border-color:#3b4a5c;background:#26313e}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover:not(:disabled){background:#ffc04a;border-color:#ffc04a}
.danger{color:var(--bad)}
.small{padding:5px 9px;font-size:13px;border-radius:9px}
input,select,textarea{font:inherit;background:#0b0f14;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(255,176,32,.5);outline-offset:0;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:13px;color:var(--muted);font-weight:500}
label>input,label>select,label>textarea{margin-top:5px;color:var(--text)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.hidden{display:none!important}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px}

/* Logo */
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:52px;line-height:.95;letter-spacing:-.03em}
.logo span{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:0 10px;border-radius:10px;margin-left:6px;transform:rotate(-2deg)}
.logo.sm{font-size:22px}
.logo.sm span{padding:0 6px;border-radius:7px;margin-left:3px}

/* Home */
.home{max-width:980px;margin:0 auto;padding:56px 20px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero p{font-size:18px;color:#c4cdd8;max-width:30em;margin:20px 0 26px}
.how{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.how li{display:flex;gap:12px;align-items:flex-start;color:#c4cdd8}
.how b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--accent)}
.home-card{display:grid;gap:14px;padding:22px}
.home-card .big{padding:14px;font-size:16px}
.or{text-align:center;color:var(--muted);font-size:13px;position:relative}
.or:before,.or:after{content:"";position:absolute;top:50%;width:28%;height:1px;background:var(--line)}
.or:before{left:0}.or:after{right:0}
#code{text-transform:uppercase;letter-spacing:.2em;font-weight:700;text-align:center}
.err{color:var(--bad);font-size:14px;min-height:1em}
.localnote{background:rgba(255,176,32,.12);border:1px dashed var(--accent);color:var(--accent);padding:6px 10px;border-radius:10px;font-size:13px}

/* Top bar */
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(14,18,23,.9);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px);flex-wrap:wrap}
.codebox{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 12px;font-size:13px;color:var(--muted)}
.codebox b{font-size:18px;letter-spacing:.18em;color:var(--text)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}

/* Lobby */
.lobby{max-width:1180px;margin:0 auto;padding:22px 20px;display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
.col{display:grid;gap:18px}
.teamgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{border:2px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 7%,var(--panel));border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.team-h{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque';font-weight:800;font-size:19px;color:var(--c)}
.team-h small{margin-left:auto;color:var(--muted);font-family:'DM Sans';font-size:13px;font-weight:500}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px;flex:1;align-content:start}
.plist li{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border-radius:10px;padding:7px 9px}
.plist li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.plist li.off .nm{opacity:.45}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.tag.you{color:var(--accent);border-color:rgba(255,176,32,.5)}
.unassigned{margin-top:12px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.unassigned .plist{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.empty{color:var(--muted);font-size:13px;font-style:italic;padding:6px 2px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settings .full{grid-column:1/-1}
.seg{display:flex;background:#0b0f14;border:1px solid var(--line);border-radius:11px;padding:3px;margin-top:5px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:7px 8px}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.chk{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.summary{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-weight:600}
.startArea{margin-top:16px;display:grid;gap:8px}
.startArea .btn-primary{padding:14px;font-size:17px}

/* Lobby: Reiter, Gruppen, Regel-Kacheln */
.lobby{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.panel-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2{margin:0}
.panel-h .muted{font-size:13px}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px}
.tab:hover:not(:disabled){background:var(--panel2);color:var(--text)}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.tcount{display:inline-grid;place-items:center;min-width:22px;height:20px;border-radius:999px;background:rgba(0,0,0,.25);font-size:12px;padding:0 6px}
.tab:not(.on) .tcount{background:var(--panel2);color:var(--text)}
.sset{display:grid;gap:14px}
.sgrp{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(0,0,0,.14)}
.sgrp h3{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sgrp h3 span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--panel2);font-size:15px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sgrid .full{grid-column:1/-1}
.lbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:5px}
.lbl .dot{width:8px;height:8px}
label .lbl+input,label .lbl+select,label .lbl+textarea{margin-top:0}
label.dim{opacity:.45}
.seg.big button{padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.seg.big button small{font-size:11px;font-weight:500;color:var(--muted)}
.seg.big button.on small{color:var(--text)}
.sw{display:flex;align-items:center;gap:12px;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text)}
.sw b{display:block;font-size:14px}
.sw small{display:block;color:var(--muted);font-size:12px}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:23px;border-radius:999px;background:#334152;position:relative;cursor:pointer;margin:0;padding:0;border:0;transition:background .15s}
.sw input:after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--ok)}
.sw input:checked:after{transform:translateX(17px)}
.sw input:focus-visible{outline:2px solid rgba(255,176,32,.6);outline-offset:2px}
.rtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.rtile{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.rtile .ri{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,176,32,.12);font-size:17px}
.rtile .rl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rtile .rv{font-weight:700;font-size:15px;line-height:1.25}
.rtile .rs{font-size:12px;color:var(--muted);line-height:1.3;margin-top:1px}
.rtile.off{opacity:.55}
.rtile.off .ri{background:rgba(255,255,255,.05);filter:grayscale(1)}
.rtile.changed{animation:rflash 1.6s ease-out}
@keyframes rflash{0%{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,176,32,.35)}100%{border-color:var(--line);box-shadow:none}}
.warnline{font-size:13px;color:var(--accent)}
.waiting{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:12px}
.wdots{display:inline-flex;gap:4px}
.wdots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:wd 1.2s infinite ease-in-out}
.wdots i:nth-child(2){animation-delay:.15s}.wdots i:nth-child(3){animation-delay:.3s}
@keyframes wd{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
/* Wortlisten */
.libbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.listtag{font-size:12px;font-weight:700;color:var(--accent);background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.35);border-radius:999px;padding:3px 10px}
.liblist{display:grid;gap:10px;max-height:60vh;overflow:auto;padding-right:4px}
.libitem{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.libhead{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.libhead h3{font-size:16px;margin:0 0 2px}
.libmeta{font-size:12px;color:var(--muted)}
.libmeta .mine{color:var(--accent)}
.libbtns{display:flex;gap:6px;flex-wrap:wrap}
.libwords{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.libwords span{font-size:12px;background:#0b0f14;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.libwords .more{color:var(--muted)}
.libedit{display:grid;gap:12px}
.empty-state{padding:26px 10px;text-align:center;color:var(--muted)}
.empty-state.err{color:var(--bad)}

/* Konto */
.acct{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.18)}
.acct .muted{flex:1}
.acct.on{border-color:rgba(53,200,115,.4)}
.acct small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .grow{min-width:0}
.acav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);flex:none}
.lgbtns{display:grid;gap:8px}
.lg{padding:12px;font-size:15px;justify-content:center;gap:10px}
.lg.discord{background:#5865F2;border-color:#5865F2;color:#fff}
.lg.discord:hover:not(:disabled){background:#4752c4;border-color:#4752c4}
.lg.google{background:#fff;border-color:#fff;color:#1f1f1f}
.lg.google:hover:not(:disabled){background:#eef0f3;border-color:#eef0f3}
.lgi{display:inline-grid;place-items:center}
.lgform{display:grid;gap:10px}

/* Neuigkeiten */
.newsbtn{position:relative}
.ndot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg)}
.news-card{grid-column:1/-1}
.news-list{display:grid;gap:10px}
.news-short{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.news-item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.news-item h3{font-size:16px;margin:2px 0 6px}
.news-item ul{margin:0;padding-left:18px;color:#c4cdd8;font-size:14px;display:grid;gap:3px}
.news-meta{display:flex;gap:8px;align-items:center}
.news-date{font-size:12px;color:var(--muted);font-weight:700}
.news-new{font-size:10px;font-weight:800;text-transform:uppercase;border-radius:5px;padding:1px 6px;background:var(--ok);color:#06210f}

/* Chat */
.chat{display:flex;flex-direction:column;min-height:0}
.log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:5px;min-height:120px;max-height:260px;padding-right:4px;margin-bottom:10px}
.msg{font-size:14px;line-height:1.35}
.msg b{color:var(--c)}
.msg .sc{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-right:4px}
.msg.sys{color:var(--muted);font-style:italic}
.chat form{display:flex;gap:6px}
.chat form select{width:auto}

/* Game */
.game-top .timer{font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;min-width:96px}
.timer.warn{color:var(--bad)}
.scores{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.score{display:flex;align-items:center;gap:8px;border-radius:12px;padding:5px 10px;background:color-mix(in srgb,var(--c) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);font-size:14px}
.score b{color:var(--c)}
.score .bingo{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:11px;border-radius:6px;padding:1px 6px}
.score.me{box-shadow:0 0 0 2px var(--c)}
.game{display:grid;grid-template-columns:minmax(0,1fr) 450px;gap:14px;padding:14px;height:calc(100vh - 63px);min-height:560px}
.viewer{padding:0;display:flex;flex-direction:column;overflow:hidden}
.vtools{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vtools select{width:auto;max-width:210px}
.vtools input{flex:1;min-width:180px}
.svwrap{flex:1;position:relative;background:#05080b}
.svwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vhint{padding:8px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.sidebar{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.boardhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.boardhead h2{margin:0}
.board{--n:5;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:5px;background:var(--paper);padding:8px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 3px var(--paper2)}
.cell{aspect-ratio:1;border:0;border-radius:8px;background:#fffaf0;color:var(--ink);padding:4px;font-weight:700;font-size:var(--fs,12px);line-height:1.1;text-align:center;position:relative;overflow:hidden;background-size:cover;background-position:center;white-space:normal;word-break:break-word;hyphens:auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .08s}
.cell:hover:not(:disabled){transform:scale(1.04);z-index:1;background-color:#fff}
.cell .w{position:relative;z-index:1}
.cell.got{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.cell.got:before{content:"";position:absolute;inset:0;background:linear-gradient(color-mix(in srgb,var(--c) 55%,transparent),color-mix(in srgb,var(--c) 80%,transparent))}
.cell.line{box-shadow:inset 0 0 0 3px var(--accent)}
.cell.free{background:var(--accent);color:var(--accent-ink);font-family:'Bricolage Grotesque';font-weight:800}
.cell.blocked{color:rgba(34,37,44,.55);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c) 22%,#fffaf0) 0 6px,#fffaf0 6px 12px)}
.cell .cnt{position:absolute;top:3px;right:3px;z-index:1;background:rgba(0,0,0,.6);color:#fff;font-size:10px;border-radius:6px;padding:0 4px;text-shadow:none}
.cell .bad{position:absolute;top:3px;left:3px;z-index:2;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--bad);color:#fff}
.myprog{margin-left:auto;font-size:13px;color:var(--muted)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,8,11,.72);z-index:50;display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(620px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal-box h2{font-size:24px}
.cap{display:grid;gap:12px}
.capprev{aspect-ratio:16/9;background:#05080b;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden}
.capprev img{width:100%;height:100%;object-fit:contain}
.capprev .ph{color:var(--muted);font-size:14px;text-align:center;padding:10px}
.caprow{display:flex;gap:8px;flex-wrap:wrap}
.capfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:110px;cursor:zoom-in}
.thumb img{width:110px;height:70px;object-fit:cover;border-radius:8px;display:block;border:2px solid var(--c,var(--line))}
.thumb div{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lightbox img{max-width:100%;max-height:78vh;border-radius:12px;display:block;margin:0 auto}
.teampick{position:fixed;inset:0;z-index:40;background:rgba(5,8,11,.8);display:grid;place-items:center}
.teampick .card{display:grid;gap:14px;text-align:center;padding:26px}

/* Vote */
.vote{max-width:1100px;margin:0 auto;padding:20px;display:grid;gap:14px}
.vote-main{display:grid;gap:14px}
.vote-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vote-head h2{font-size:30px;margin:0}
.vote-img{width:100%;max-height:58vh;object-fit:contain;background:#05080b;border-radius:12px;cursor:zoom-in}
.vote-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.vote-bar .yes,.vote-bar .no{padding:13px 22px;font-size:16px}
.vote-bar .yes.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.vote-bar .no.on{background:var(--bad);border-color:var(--bad);color:#2a0509}
.tally{display:flex;gap:14px;font-weight:700;font-size:15px}
.tally .y{color:var(--ok)}.tally .n{color:var(--bad)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.strip button{padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;flex:none;position:relative;background:#05080b}
.strip button.cur{border-color:var(--accent)}
.strip img{width:92px;height:58px;object-fit:cover;display:block}
.strip .st{position:absolute;bottom:3px;right:3px;font-size:12px;border-radius:5px;padding:0 4px;background:rgba(0,0,0,.7)}

/* Draft */
.draft{max-width:1180px;margin:0 auto;padding:20px;display:grid;gap:16px}
.draft-intro{display:grid;gap:6px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;transition:border-color .15s,background .15s}
.dcard.in{border-color:rgba(255,176,32,.6);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.dw{font-family:'Bricolage Grotesque';font-weight:800;font-size:17px;line-height:1.15;min-height:2.3em}
.dmeta{display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap}
.dscore{font-weight:800;font-size:15px;min-width:26px}
.dscore.pos{color:var(--ok)}.dscore.neg{color:var(--bad)}
.din{margin-left:auto;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dbtns .up.on{background:var(--ok);border-color:var(--ok)}
.dbtns .down.on{background:var(--bad);border-color:var(--bad)}

/* Results */
.results{max-width:1180px;margin:0 auto;padding:22px 20px;display:grid;gap:20px}
.winner{text-align:center;padding:26px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.winner .display{font-size:44px;font-weight:800;color:var(--c)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rcard{border-top:4px solid var(--c)}
.rcard .rh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rcard .rank{font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;color:var(--muted)}
.rcard .stats{display:flex;gap:16px;margin:8px 0 12px;font-size:14px}
.rcard .stats b{font-size:20px;display:block;color:var(--text)}
.mini{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;background:var(--paper);padding:5px;border-radius:9px}
.mini span{aspect-ratio:1;border-radius:4px;background:#fffaf0;position:relative}
.mini span.v{background:var(--c)}
.mini span.x{background:repeating-linear-gradient(45deg,#ffd5d8 0 3px,#fffaf0 3px 6px)}
.mini span.f{background:var(--accent)}
.mini span.l{box-shadow:inset 0 0 0 2px var(--accent-ink)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.gitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;border-top:3px solid var(--c)}
.gitem img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.gitem .gi{padding:7px 9px;font-size:13px;display:flex;gap:6px;align-items:center}
.gitem .gi b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitem.rej img{filter:grayscale(1) opacity(.55)}

/* Status screens */
.center{min-height:80vh;display:grid;place-items:center;text-align:center;padding:20px}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toasts */
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:#0b0f14;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:600;animation:tin .25s ease-out;max-width:90vw}
.toast.big{font-size:20px;font-family:'Bricolage Grotesque';font-weight:800;padding:14px 22px}
@keyframes tin{from{transform:translateY(12px);opacity:0}}

.vtools{align-items:center}

.chip{padding:5px 11px 5px 6px;font-size:13px;border-radius:999px;position:relative;flex:none}
.chip .n,.locbtn .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#0b0f14;font-size:11px;flex:none}
.chip.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.cur .n{background:rgba(0,0,0,.18)}
.chip.new:after{content:"";position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--panel)}
.nextloc{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.nextloc b{color:var(--text)}
.svwrap iframe.off{visibility:hidden;pointer-events:none}
.svempty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.mapov{position:absolute;inset:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) 270px}
.mapbox{position:relative;min-height:0}

#wmap svg{display:block;touch-action:none;cursor:grab}
#wmap svg:active{cursor:grabbing}

.wgrat{fill:none;stroke:rgba(255,255,255,.07);stroke-width:.6;vector-effect:non-scaling-stroke}
.wland{fill:#2c3d50;stroke:#55697f;stroke-width:.6;vector-effect:non-scaling-stroke}
.wland:hover{fill:#354a60}
.mkg{cursor:pointer}
.mkg circle{fill:#1f2833;stroke:#fff;stroke-width:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.mkg.cur circle{fill:var(--accent)}
.mkg.new circle{fill:var(--ok);animation:mkp 1.4s ease-in-out infinite}
@keyframes mkp{50%{stroke:#35c873;stroke-width:7;stroke-opacity:.6}}
.mkn{fill:#fff;font:700 12px 'DM Sans',sans-serif;text-anchor:middle;pointer-events:none}

.mkg.new .mkn{fill:#06210f}

.wzoom button{width:34px;height:34px;padding:0;font-size:18px}
.wattr{position:absolute;left:8px;bottom:6px;font-size:10px;color:var(--muted)}

.maplist{border-left:1px solid var(--line);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:6px;background:var(--panel)}

.locbtn.cur{border-color:var(--accent)}
.locbtn.cur .n{background:var(--accent);color:var(--accent-ink)}
.badge{font-size:10px;font-weight:800;text-transform:uppercase;border-radius:5px;padding:1px 5px;background:var(--ok);color:#06210f;margin-left:auto;flex:none}
.batchh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.mk{width:28px;height:28px;border-radius:50%;background:#1f2833;border:2px solid #fff;color:#fff;display:grid;place-items:center;font:700 12px 'DM Sans',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer}

.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(53,200,115,.35)}}

.inter{position:fixed;inset:0;z-index:30;background:rgba(14,18,23,.97);overflow:auto}

}

  .teamgrid{grid-template-columns:1fr}

/* ---------------- Wortlisten-Bibliothek (Supabase) ----------------
   Öffentliche Projekt-Adresse + öffentlicher Schlüssel (anon/publishable). Beides ist
   absichtlich öffentlich – die Zugriffsregeln (Row Level Security) liegen in der Datenbank. */
const SUPA = { url: 'https://eaydvicdtlnkuniqeqte.supabase.co', key: 'sb_publishable_uwIVu_m7tRGESPC9wwHl5Q_t7Brxupn' };
const supaReady = () => !!(SUPA.url && SUPA.key);
// Welche Login-Anbieter in Supabase eingerichtet sind (nur diese werden angezeigt)
const AUTH_PROVIDERS = { discord: true, google: false, email: false };
const userInfo = u => {
  if (!u) return {};
  const m = u.user_metadata || {};
  const prov = (u.app_metadata && u.app_metadata.provider) || '';
  return { uid: u.id, anon: !!u.is_anonymous || (!u.email && !(u.identities || []).length && prov !== 'discord' && prov !== 'google'),
    email: u.email || '', provider: prov, uname: m.custom_claims?.global_name || m.full_name || m.name || m.user_name || (u.email ? u.email.split('@')[0] : '') };
};
const slimSession = (x, prev) => ({ access_token: x.access_token, refresh_token: x.refresh_token,
  expires_at: +x.expires_at || Math.floor(Date.now() / 1000) + (+x.expires_in || 3600), ...(x.user ? userInfo(x.user) : prev ? { uid: prev.uid, anon: prev.anon, email: prev.email, provider: prev.provider, uname: prev.uname } : {}) });
const account = () => { const s = store.get('supaSession', null); return s && s.uid && !s.anon ? s : null; };
async function supaAuth() {
  // Anonyme Anmeldung: jeder Browser bekommt eine eigene, unsichtbare Kennung → „meine Listen“
  let ses = store.get('supaSession', null);
  if (ses && ses.expires_at - 60 > Date.now() / 1000) return ses;
  const post = (path, body) => fetch(SUPA.url + '/auth/v1/' + path, { method:'POST', headers:{ apikey:SUPA.key, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  if (ses && ses.refresh_token) {
    const r = await post('token?grant_type=refresh_token', { refresh_token: ses.refresh_token });
    if (r.ok) { ses = slimSession(await r.json(), ses); store.set('supaSession', ses); return ses; }
    if (!ses.anon) { store.set('supaSession', null); toast('Deine Anmeldung ist abgelaufen – bitte melde dich neu an.', '#ff5d6c'); }
  }
  const r = await post('signup', {});
  if (!r.ok) throw new Error('Anmeldung bei der Wortlisten-Datenbank fehlgeschlagen (' + r.status + ')');
  ses = slimSession(await r.json()); store.set('supaSession', ses); return ses;
}
async function supa(path, { method = 'GET', body, auth = false, prefer } = {}) {
  const h = { apikey: SUPA.key, 'Content-Type': 'application/json' }; // ohne Anmeldung: nur der öffentliche Schlüssel
  if (auth) h.Authorization = 'Bearer ' + (await supaAuth()).access_token;
  if (prefer) h.Prefer = prefer;
  const r = await fetch(SUPA.url + '/rest/v1/' + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch {} throw new Error(m || 'Fehler ' + r.status); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
const myUid = () => (store.get('supaSession', null) || {}).uid || null;

/* ---------------- Konto (optional): Discord, Google, E-Mail ----------------
   Spielen geht ohne Konto. Wer sich anmeldet, nimmt die Wortlisten seines bisherigen
   Gast-Profils mit (über einen einmaligen Übernahme-Code). */
const authPost = (path, body, token) => fetch(SUPA.url + '/auth/v1/' + path, { method:'POST',
  headers:{ apikey:SUPA.key, 'Content-Type':'application/json', ...(token ? { Authorization:'Bearer ' + token } : {}) }, body: JSON.stringify(body || {}) });
async function authJSON(r) { let j = {}; try { j = await r.json(); } catch {} if (!r.ok) throw new Error(j.msg || j.error_description || j.message || ('Fehler ' + r.status)); return j; }
async function prepareTransfer() {
  // nur wenn bisher ein Gast-Profil existiert
  const ses = store.get('supaSession', null); if (!ses || !ses.anon) return;
  try { const code = await supa('rpc/prepare_transfer', { method:'POST', auth:true, body:{} }); if (code) store.set('listTransfer', code); } catch {}
}
async function claimTransfer() {
  const code = store.get('listTransfer', null); if (!code) return;
  store.set('listTransfer', null);
  try { const n = await supa('rpc/claim_transfer', { method:'POST', auth:true, body:{ c: code } }); if (n > 0) toast(`📚 ${n} Wortliste${n === 1 ? '' : 'n'} in dein Konto übernommen`); } catch {}
}
async function finishLogin(tokens) {
  const r = await fetch(SUPA.url + '/auth/v1/user', { headers:{ apikey:SUPA.key, Authorization:'Bearer ' + tokens.access_token } });
  const user = await authJSON(r);
  store.set('supaSession', slimSession({ ...tokens, user }));
  await claimTransfer();
  const acc = account();
  if (acc && acc.uname && !S.me.name) { S.me.name = acc.uname.slice(0, 20); store.set('name', S.me.name); }
  return acc;
}
async function loginWith(provider) {
  if (!supaReady()) return;

  const back = location.origin + location.pathname;
  const code = ($('#code') && $('#code').value.trim()) || '';
  if (code) store.set('afterLoginCode', code, true);
  location.href = `${SUPA.url}/auth/v1/authorize?provider=${provider}&redirect_to=${encodeURIComponent(back)}`;
}
async function logout() {
  const ses = store.get('supaSession', null);
  if (ses) authPost('logout', {}, ses.access_token).catch(() => {});
  store.set('supaSession', null);
  toast('Abgemeldet'); render(); if (S.view === 'home' && !S.state) { S.mounted = null; render(); }
}
/* Rückkehr vom Login (Discord/Google): Tokens stehen im #-Teil der Adresse */
async function handleAuthReturn() {
  const h = location.hash.slice(1);
  if (!/(^|&)(access_token|error)=/.test(h) && !/[?&]error=/.test(location.search)) return;
  const p = new URLSearchParams(h.includes('=') ? h : location.search.slice(1));
  const code = store.get('afterLoginCode', '', true); store.set('afterLoginCode', '', true);
  history.replaceState(null, '', location.pathname + (code ? '#' + code : ''));
  if (p.get('error')) { toast('Anmeldung abgebrochen: ' + (p.get('error_description') || p.get('error')).replace(/\+/g, ' '), '#ff5d6c'); return; }
  try {
    const acc = await finishLogin({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_at: p.get('expires_at'), expires_in: p.get('expires_in') });
    toast(`✅ Angemeldet als ${acc ? acc.uname || acc.email : 'Spieler'}`, '#35c873');
  } catch (e) { toast('Anmeldung fehlgeschlagen: ' + e.message, '#ff5d6c'); }
  S.mounted = null; render();
}

  isHost:false, code:null, state:null, images:{}, chat:[], net:null, offset:0, pos:null, chatScope:'team', err:''

/* ============================================================
   Netzwerk
   ============================================================ */
function loadPeer() {
  return new Promise((res, rej) => {
    if (window.Peer) return res();
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = () => window.Peer ? res() : rej(new Error('PeerJS fehlt'));
    s.onerror = () => rej(new Error('PeerJS konnte nicht geladen werden'));
    document.head.appendChild(s);
  });
}

function createHostNet(code, h) {
  if (LOCAL) {
    const bc = new BroadcastChannel('sb-' + code); const conns = new Set();
    bc.onmessage = e => {
      const d = e.data; if (d.to !== 'host') return;
      if (d.k === 'open') { conns.add(d.from); bc.postMessage({to:d.from, k:'opened'}); h.onConn(d.from); }
      else if (d.k === 'close') { conns.delete(d.from); h.onClose(d.from); }
      else if (d.k === 'msg') h.onMsg(d.from, d.msg);
    };
    addEventListener('beforeunload', () => conns.forEach(c => bc.postMessage({to:c, k:'kill'})));
    setTimeout(h.onReady, 0);
    return {
      send(cid, msg) { if (conns.has(cid)) bc.postMessage({to:cid, k:'msg', msg}); },
      broadcast(msg) { conns.forEach(c => bc.postMessage({to:c, k:'msg', msg})); },
      close(cid) { bc.postMessage({to:cid, k:'kill'}); conns.delete(cid); }
    };
  }
  const peer = new Peer(PREFIX + code, {debug:0});
  const conns = new Map();
  peer.on('open', () => h.onReady());
  peer.on('error', e => h.onError(e));
  peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
  peer.on('connection', conn => {
    const cid = conn.connectionId;
    conn.on('open', () => { conns.set(cid, conn); h.onConn(cid); });
    conn.on('data', d => h.onMsg(cid, d));
    conn.on('close', () => { if (conns.delete(cid)) h.onClose(cid); });
    conn.on('error', () => { if (conns.delete(cid)) h.onClose(cid); });
  });
  return {
    send(cid, msg) { const c = conns.get(cid); if (c && c.open) try { c.send(msg); } catch (e) { console.warn(e); } },
    broadcast(msg) { conns.forEach((c, cid) => this.send(cid, msg)); },
    close(cid) { const c = conns.get(cid); conns.delete(cid); if (c) setTimeout(() => c.close(), 300); }
  };
}

function createClientNet(code, h) {
  let done = false;
  const timer = setTimeout(() => { if (!done) h.onError('Lobby nicht gefunden. Stimmt der Code?'); }, LOCAL ? 2500 : 15000);
  if (LOCAL) {
    const id = uid(); const bc = new BroadcastChannel('sb-' + code);
    bc.onmessage = e => {
      const d = e.data; if (d.to !== id) return;
      if (d.k === 'opened') { done = true; clearTimeout(timer); h.onOpen(); }
      else if (d.k === 'msg') h.onMsg(d.msg);
      else if (d.k === 'kill') h.onClose();
    };
    bc.postMessage({to:'host', from:id, k:'open'});
    addEventListener('beforeunload', () => bc.postMessage({to:'host', from:id, k:'close'}));
    return { send(msg) { bc.postMessage({to:'host', from:id, k:'msg', msg}); } };
  }
  const peer = new Peer({debug:0}); let conn = null;
  peer.on('open', () => {
    conn = peer.connect(PREFIX + code, {reliable:true});
    conn.on('open', () => { done = true; clearTimeout(timer); h.onOpen(); });
    conn.on('data', d => h.onMsg(d));
    conn.on('close', () => h.onClose());
    conn.on('error', () => h.onClose());
  });
  peer.on('error', e => {
    if (done) return;
    done = true; clearTimeout(timer);
    h.onError(e.type === 'peer-unavailable' ? 'Lobby nicht gefunden. Stimmt der Code?' : 'Verbindung fehlgeschlagen (' + (e.type || e.message) + ').');
  });
  return { send(msg) { if (conn && conn.open) try { conn.send(msg); } catch (e) { console.warn(e); } } };
}

/* Spieleraktion: Host verarbeitet direkt, Clients senden an den Host */
function act(msg) {
  if (S.isHost) hostHandle('self', msg);
  else if (S.net) S.net.send(msg);
}

/* ============================================================
   Spiellogik (gemeinsam)
   ============================================================ */
function sides(st) {
  if (st.settings.mode === 'team') {
    return [0, 1].map(i => ({
      id:'t' + i, name: st.settings.teamNames[i] || ('Team ' + (i + 1)), color: TEAMC[i],
      members: Object.keys(st.players).filter(p => st.players[p].team === i)
    }));
  }
  return Object.keys(st.players).map((p, i) => ({ id:'p:' + p, name: st.players[p].name, color: SOLOC[(st.players[p].ci ?? i) % SOLOC.length], members:[p] }));
}
function sideOf(st, pid) {
  const p = st.players[pid]; if (!p) return null;
  if (st.settings.mode === 'team') return p.team == null ? null : 't' + p.team;
  return 'p:' + pid;
}
function sideInfo(st, sideId) {
  const s = sides(st).find(x => x.id === sideId);
  if (s) return s;
  return { id: sideId, name: '?', color: '#888', members: [] };
}
function isValid(st, fid) {
  if (!st.settings.voting) return true;
  if ((st.phase === 'game' || st.phase === 'intermission') && !(st.reviewed || {})[fid]) return true; // noch nicht geprüft
  if (st.phase === 'lobby') return true;
  const v = st.votes[fid] || {}; let y = 0, n = 0;
  for (const x of Object.values(v)) x > 0 ? y++ : n++;
  return n <= y;
}
function claimed(st, sideId, validOnly) {
  const set = new Set(); if (st.free != null) set.add(st.free);
  for (const [fid, f] of Object.entries(st.findings)) if (f.side === sideId && (!validOnly || isValid(st, fid))) set.add(f.cell);
  return set;
}
function boardLines(size) {
  const L = [];
  for (let r = 0; r < size; r++) L.push([...Array(size)].map((_, c) => r * size + c));
  for (let c = 0; c < size; c++) L.push([...Array(size)].map((_, r) => r * size + c));
  L.push([...Array(size)].map((_, i) => i * size + i));
  L.push([...Array(size)].map((_, i) => i * size + (size - 1 - i)));
  return L;
}
/* Jede Seite (Team bzw. Einzelspieler) hat eine eigene zufällige Anordnung derselben Begriffe:
   layout[Position] = Index des Begriffs in st.board. Funde speichern den Begriffs-Index. */
function layoutOf(st, sideId) {
  const L = st.layouts && st.layouts[sideId];
  return L && L.length === st.board.length ? L : st.board.map((_, i) => i);
}
function ensureLayouts() {
  H.layouts = H.layouts || {};
  for (const sd of sides(H)) if (!H.layouts[sd.id]) H.layouts[sd.id] = shuffle(H.board.map((_, i) => i));
}
function lineInfo(size, set, layout) {
  const full = boardLines(size).map(l => layout ? l.map(p => layout[p]) : l).filter(l => l.every(i => set.has(i)));
  return { count: full.length, cells: new Set(full.flat()) };
}
function standings(st) {
  const n = st.board.length, size = Math.round(Math.sqrt(n));
  const cmp = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
  const res = sides(st).map(sd => {
    const set = claimed(st, sd.id, true); const li = lineInfo(size, set, layoutOf(st, sd.id));
    const cells = set.size - (st.free != null ? 1 : 0);
    return { ...sd, set, lines: li.count, lineCells: li.cells, cells, full: set.size === n };
  });
  const w = st.settings.win;
  res.forEach(r => r.key = w === 'line' ? [r.lines > 0 ? 1 : 0, r.lines, r.cells] : w === 'full' ? [r.full ? 1 : 0, r.cells, r.lines] : [r.cells, r.lines]);
  res.sort((a, b) => cmp(b.key, a.key));
  const top = res[0];
  res.forEach((r, i) => { r.rank = 1 + res.findIndex(x => cmp(x.key, r.key) === 0); r.win = !!top && cmp(r.key, top.key) === 0 && top.cells > 0; });
  return res;
}
function eligibleVoters(st, f) {
  const online = Object.keys(st.players).filter(p => st.players[p].online);
  const opp = online.filter(p => sideOf(st, p) !== f.side);
  return opp.length ? opp : online;
}
function wordPool(s) {
  const custom = [...new Set(s.custom.split(/[\n,;]+/).map(w => w.trim()).filter(Boolean).map(w => w.slice(0, 40)))];
  if (s.wordMode === 'custom') return custom;
  if (s.wordMode === 'mix') return [...new Set([...custom, ...WORDS])];
  return WORDS.slice();
}

/* ============================================================
   Host
   ============================================================ */
function startHost(name) {
  S.me.name = name; store.set('name', name);
  S.isHost = true; S.view = 'connecting'; render();
  const tryCode = (attempt) => {
    const code = genCode();
    H = {
      phase:'lobby', code, hostPid:S.me.pid, settings:{...DEFAULT_SETTINGS, ...store.get('settings', {}), teamNames:[...(store.get('settings', {}).teamNames || DEFAULT_SETTINGS.teamNames)]},
      players:{}, board:[], free:null, findings:{}, votes:{}, voteOrder:[], voteIdx:0, endsAt:0, startedAt:0, endReason:'', round:0, lineCount:{}, nextCi:0,
      locs:{}, locBatch:0, nextLocAt:0, reviewed:{}, sinceReview:0, pausedAt:0, jokers:{}
    };
    H.players[S.me.pid] = { name, team:null, online:true, ci: H.nextCi++ };
    connPid.self = S.me.pid;
    S.net = createHostNet(code, {
      onReady() { S.code = code; S.state = H; location.hash = code; render(); },
      onError(e) {
        if (e && e.type === 'unavailable-id' && attempt < 3) return tryCode(attempt + 1);
        if (S.state) { if (e && e.type === 'network') toast('Netzwerkproblem – versuche neu zu verbinden …', '#ff5d6c'); return; }
        S.isHost = false; S.view = 'home'; S.err = 'Lobby konnte nicht erstellt werden (' + (e && (e.type || e.message)) + ').'; render();
      },
      onConn() {},
      onMsg: hostHandle,
      onClose(cid) {
        const pid = connPid[cid]; delete connPid[cid]; if (!pid || !H.players[pid]) return;
        if (Object.values(connPid).includes(pid)) return; // noch anders verbunden
        if (H.phase === 'lobby') delete H.players[pid]; else H.players[pid].online = false;
        commit();
      }
    });
  };
  tryCode(0);
}

function hostSendTo(pid, msg) {
  if (pid === S.me.pid) return clientMsg(msg);
  for (const [cid, p] of Object.entries(connPid)) if (p === pid && cid !== 'self') S.net.send(cid, msg);
}
function hostBroadcast(msg) { S.net.broadcast(msg); clientMsg(msg); }
let commitTimer = null;
function commit() {
  clearTimeout(commitTimer); commitTimer = null;
  S.net.broadcast({t:'state', state:H, now:Date.now()});
  S.state = H; render();
}
function commitSoon() { if (!commitTimer) commitTimer = setTimeout(commit, 150); }
function announce(text, color, big) { hostBroadcast({t:'event', text, color, big}); }

function chatTargets(scope) {
  if (scope === 'all') return Object.keys(H.players);
  const t = +scope.slice(1); return Object.keys(H.players).filter(p => H.players[p].team === t);
}
function hostChatPush(entry) {
  hostChat.push(entry); if (hostChat.length > 200) hostChat.shift();
  chatTargets(entry.scope).forEach(p => hostSendTo(p, {t:'chat', m:entry}));
}

function hostHandle(cid, msg) {
  if (!H || !msg || typeof msg !== 'object') return;
  let pid = connPid[cid];
  if (msg.t === 'hello') {
    pid = String(msg.pid || '').slice(0, 24) || uid();
    const name = String(msg.name || 'Gast').trim().slice(0, 20) || 'Gast';
    connPid[cid] = pid;
    let p = H.players[pid];
    if (!p) {
      p = H.players[pid] = { name, team:null, online:true, ci: H.nextCi++ };
      if (H.phase !== 'lobby' && H.settings.mode === 'team') {
        const c = [0, 1].map(i => Object.values(H.players).filter(x => x.team === i).length);
        p.team = c[0] <= c[1] ? 0 : 1;
      }
    }
    p.name = name; p.online = true;
    if (H.phase === 'game' || H.phase === 'intermission') ensureLayouts();
    if ((H.phase === 'game' || H.phase === 'intermission') && !(H.locs[pid] || []).length) {
      for (let b = 0; b < Math.max(1, H.locBatch); b++) H.locs[pid] = (H.locs[pid] || []).concat(pickLocs(pid, H.settings.locCount, b));
    }
    S.net.send(cid, {t:'welcome', code:H.code});
    for (const fid of Object.keys(H.findings)) if (S.images[fid]) S.net.send(cid, {t:'img', fid, data:S.images[fid]});
    const t = p.team;
    S.net.send(cid, {t:'chathist', list: hostChat.filter(m => m.scope === 'all' || (t != null && m.scope === 't' + t))});
    hostChatPush({scope:'all', sys:true, text: name + ' ist beigetreten', ts:Date.now()});
    commit(); return;
  }
  if (!pid || !H.players[pid]) return;
  const p = H.players[pid];
  switch (msg.t) {
    case 'team': {
      if (H.settings.mode !== 'team') return;
      const team = msg.team === 0 || msg.team === 1 ? msg.team : null;
      if (H.phase === 'lobby' || (H.phase === 'game' && p.team == null && team != null)) { p.team = team; commit(); }
      return;
    }
    case 'chat': {
      const text = String(msg.text || '').trim().slice(0, 300); if (!text) return;
      let scope = 'all';
      if (msg.scope === 'team' && H.settings.mode === 'team' && p.team != null) scope = 't' + p.team;
      const sd = sideOf(H, pid);
      hostChatPush({scope, name:p.name, color: sd ? sideInfo(H, sd).color : '#8e9bab', text, ts:Date.now()});
      return;
    }
    case 'capture': {
      if (H.phase !== 'game') return hostSendTo(pid, {t:'toast', text:'Das Spiel läuft gerade nicht.'});
      const cell = msg.cell | 0; const side = sideOf(H, pid);
      if (!side) return hostSendTo(pid, {t:'toast', text:'Wähle zuerst ein Team.'});
      if (cell < 0 || cell >= H.board.length || cell === H.free) return;
      const img = String(msg.img || '');
      if (!/^data:image\/(jpeg|png|webp);base64,/.test(img) || img.length > 600000) return hostSendTo(pid, {t:'toast', text:'Bild ungültig oder zu groß.'});
      if (H.settings.lockout) {
        const other = Object.entries(H.findings).map(([id, f]) => isValid(H, id) && f).find(f => f && f.cell === cell && f.side !== side);
        if (other) return hostSendTo(pid, {t:'toast', text:'Zu spät – dieses Feld hat schon ' + sideInfo(H, other.side).name + '.'});
      }
      for (const [fid, f] of Object.entries(H.findings)) if (f.pid === pid && f.cell === cell) { delete H.findings[fid]; delete S.images[fid]; }
      const fid = uid(10);
      S.images[fid] = img;
      S.net.broadcast({t:'img', fid, data:img});
      H.findings[fid] = { pid, side, cell, ts:Date.now() };
      H.sinceReview++;
      const sd = sideInfo(H, side);
      announce((H.settings.mode === 'team' ? p.name + ' (' + sd.name + ')' : p.name) + ' hat „' + H.board[cell] + '“ gefunden', sd.color);
      hostCheckLines();
      if (H.phase === 'game' && H.settings.voting && H.settings.interEvery && H.sinceReview >= H.settings.interEvery) return hostIntermission();
      commit(); return;
    }
    case 'remove': {
      if (H.phase !== 'game') return;
      const f = H.findings[msg.fid]; if (!f || f.pid !== pid) return;
      delete H.findings[msg.fid]; H.lineCount[f.side] = Math.min(H.lineCount[f.side] || 0, lineInfo(Math.round(Math.sqrt(H.board.length)), claimed(H, f.side, true), layoutOf(H, f.side)).count);
      commit(); return;
    }
    case 'choose': {
      if (H.phase !== 'game') return;
      const list = H.locs[pid] || []; const l = list.find(x => x.id === msg.id);
      if (!l || l.ch || list.some(x => x.b === l.b && x.ch)) return;
      l.ch = true;
      H.locs[pid] = list.filter(x => x.b !== l.b || x.ch); // die anderen Vorschläge verschwinden
      commit(); return;
    }
    case 'joker': {
      if (H.phase !== 'game') return;
      const left = H.settings.jokers - (H.jokers[pid] || 0);
      const list = H.locs[pid] || []; const i = list.findIndex(l => l.id === msg.id && l.ch);
      if (left <= 0 || i < 0) return;
      const repl = pickLocs(pid, 1, list[i].b)[0]; if (!repl) return;
      repl.ch = true; list[i] = repl; H.jokers[pid] = (H.jokers[pid] || 0) + 1;
      hostSendTo(pid, {t:'joker', from:msg.id, to:repl.id});
      commit(); return;
    }
    case 'dvote': {
      if (H.phase !== 'draft') return;
      const i = msg.i | 0; if (i < 0 || i >= H.draftWords.length) return;
      H.draftVotes[i] = H.draftVotes[i] || {};
      if (msg.v === 1 || msg.v === -1) H.draftVotes[i][pid] = msg.v; else delete H.draftVotes[i][pid];
      commitSoon(); return;
    }
    case 'dready': {
      if (H.phase !== 'draft') return;
      if (msg.r) H.draftReady[pid] = true; else delete H.draftReady[pid];
      const online = Object.keys(H.players).filter(p => H.players[p].online);
      if (online.length && online.every(p => H.draftReady[p])) return hostFinishDraft();
      commit(); return;
    }
    case 'vote': {
      if (H.phase !== 'vote' && H.phase !== 'intermission') return;
      const f = H.findings[msg.fid]; if (!f || !H.voteOrder.includes(msg.fid)) return;
      if (!eligibleVoters(H, f).includes(pid)) return;
      H.votes[msg.fid] = H.votes[msg.fid] || {};
      if (msg.v === 1 || msg.v === -1) H.votes[msg.fid][pid] = msg.v; else delete H.votes[msg.fid][pid];
      commit(); return;
    }
  }
}

function hostCheckLines() {
  const size = Math.round(Math.sqrt(H.board.length));
  for (const sd of sides(H)) {
    const set = claimed(H, sd.id, true); const li = lineInfo(size, set, layoutOf(H, sd.id));
    const prev = H.lineCount[sd.id] || 0;
    if (li.count > prev) {
      H.lineCount[sd.id] = li.count;
      if (H.settings.win === 'line') return hostEnd('BINGO! ' + sd.name + ' hat eine volle Reihe!', sd.color);
      announce('BINGO! ' + sd.name + ' hat ' + (li.count === 1 ? 'eine Reihe' : li.count + ' Reihen') + '!', sd.color, true);
    }
    if (H.settings.win === 'full' && set.size === H.board.length) return hostEnd(sd.name + ' hat die volle Karte!', sd.color);
  }
}

/* ---------- Wort-Draft ---------- */
const hasFree = () => false; // kein Freifeld – jedes Feld ist ein Begriff
const wordsNeeded = s => s.size * s.size - (hasFree(s) ? 1 : 0);
function draftRanking(st) {
  // Punkte = Upvotes − Downvotes; bei Gleichstand entscheidet die (zufällige) Reihenfolge der Liste
  return st.draftWords.map((w, i) => {
    const v = Object.values(st.draftVotes[i] || {});
    return { w, i, up: v.filter(x => x > 0).length, down: v.filter(x => x < 0).length };
  }).map(r => ({ ...r, score: r.up - r.down }))
    .sort((a, b) => b.score - a.score || a.i - b.i);
}
function hostStart() {
  const s = H.settings; const need = wordsNeeded(s);
  let pool = shuffle(wordPool(s));
  if (pool.length < need) pool = [...pool, ...shuffle(WORDS.filter(w => !pool.includes(w)))];
  if (!s.draft) return hostBeginGame(pool.slice(0, need));
  for (const pid of Object.keys(H.players)) if (!H.players[pid].online) delete H.players[pid];
  let cands = pool.slice(0, need * 2);
  if (cands.length < need * 2) cands = [...cands, ...shuffle(WORDS.filter(w => !cands.includes(w)))].slice(0, need * 2);
  H.phase = 'draft'; H.draftWords = cands; H.draftVotes = {}; H.draftReady = {};
  H.draftEnds = s.draftTime ? Date.now() + s.draftTime * 1000 : 0;
  hostBroadcast({t:'reset'});
  announce('🗳 Wort-Draft! Stimmt ab, welche Begriffe auf die Karte kommen.', '#ffb020', true);
  commit();
}
function hostFinishDraft() {
  if (H.phase !== 'draft') return;
  const need = wordsNeeded(H.settings);
  hostBeginGame(draftRanking(H).slice(0, need).map(r => r.w));
}
function hostBeginGame(words) {
  const s = H.settings; const n = s.size * s.size;
  H.board = shuffle(words).slice(0, n);
  H.free = hasFree(s) ? Math.floor(n / 2) : null;
  if (H.free != null) H.board.splice(H.free, 0, 'FREI');
  H.board = H.board.slice(0, n);
  H.draftWords = []; H.draftVotes = {}; H.draftReady = {}; H.draftEnds = 0;
  H.layouts = {};
  H.findings = {}; H.votes = {}; H.voteOrder = []; H.voteIdx = 0; H.lineCount = {}; H.endReason = '';
  H.reviewed = {}; H.sinceReview = 0; H.pausedAt = 0; H.jokers = {}; H.locs = {}; H.locBatch = 0;
  S.images = {};
  for (const pid of Object.keys(H.players)) if (!H.players[pid].online) delete H.players[pid];
  H.phase = 'game'; H.round++; H.startedAt = Date.now();
  ensureLayouts();
  H.endsAt = s.minutes ? Date.now() + s.minutes * 60000 : 0;
  giveBatch();
  H.nextLocAt = s.locEvery && s.maxLocs !== 1 ? Date.now() + s.locEvery * 60000 : 0;
  if (H.endsAt && H.nextLocAt >= H.endsAt) H.nextLocAt = 0;
  hostBroadcast({t:'reset'});
  announce('Los geht’s! Wähle auf der Weltkarte einen deiner Orte.', '#ffb020', true);
  commit();
}

/* Zufällige Orte für einen Spieler (ohne Wiederholung, solange möglich) */
function pickLocs(pid, n, batch) {
  const pool = regionLocs(H.settings.region);
  const used = new Set((H.locs[pid] || []).map(l => l.n));
  let avail = pool.filter(l => !used.has(l[2]));
  if (avail.length < n) avail = pool;
  const j = () => (Math.random() - .5) * 0.003;
  return shuffle(avail).slice(0, n).map(l => ({
    id: uid(8), c: l[1], n: l[2], lat: +(l[3] + j()).toFixed(6), lng: +(l[4] + j()).toFixed(6), h: Math.floor(Math.random() * 360), b: batch
  }));
}
function giveBatch() {
  if (H.settings.maxLocs && H.locBatch >= H.settings.maxLocs) return;
  H.jokers = {}; // Joker füllen sich mit jeder neuen Auswahl wieder auf
  for (const pid of Object.keys(H.players)) H.locs[pid] = (H.locs[pid] || []).concat(pickLocs(pid, H.settings.locCount, H.locBatch));
  H.locBatch++;
}

/* Zwischenrunde: neue Fotos prüfen, Zeit pausiert */
function unreviewed() {
  return Object.keys(H.findings).filter(f => !H.reviewed[f])
    .sort((a, b) => H.findings[a].cell - H.findings[b].cell || H.findings[a].side.localeCompare(H.findings[b].side) || H.findings[a].ts - H.findings[b].ts);
}
function hostIntermission() {
  const order = unreviewed(); H.sinceReview = 0;
  if (!order.length) return commit();
  H.phase = 'intermission'; H.pausedAt = Date.now(); H.voteOrder = order; H.voteIdx = 0;
  announce('⏸ Zwischenrunde! Prüft die neuen Fotos.', '#ffb020', true);
  commit();
}
function hostResume() {
  if (H.phase !== 'intermission') return;
  const d = Date.now() - H.pausedAt;
  if (H.endsAt) H.endsAt += d;
  if (H.nextLocAt) H.nextLocAt += d;
  H.voteOrder.forEach(f => H.reviewed[f] = true);
  H.phase = 'game'; H.pausedAt = 0; H.voteOrder = []; H.voteIdx = 0;
  const size = Math.round(Math.sqrt(H.board.length));
  const rejected = Object.keys(H.reviewed).filter(f => H.findings[f] && !isValid(H, f)).length;
  for (const sd of sides(H)) H.lineCount[sd.id] = lineInfo(size, claimed(H, sd.id, true), layoutOf(H, sd.id)).count;
  announce('▶ Weiter geht’s!' + (rejected ? ' ' + rejected + ' Foto' + (rejected === 1 ? ' wurde' : 's wurden') + ' abgelehnt.' : ''), '#ffb020', true);
  commit();
}

function hostEnd(reason, color) {
  if (H.phase !== 'game' && H.phase !== 'intermission') return;
  if (H.phase === 'intermission' && H.endsAt) H.endsAt += Date.now() - H.pausedAt;
  H.endReason = reason; H.pausedAt = 0;
  const fids = H.settings.voting ? unreviewed() : [];
  H.voteOrder = fids; H.voteIdx = 0;
  H.phase = fids.length ? 'vote' : 'results';
  announce(reason, color || '#ffb020', true);
  commit();
}

function hostToLobby() {
  H.phase = 'lobby'; H.findings = {}; H.votes = {}; H.board = []; H.voteOrder = []; H.voteIdx = 0; H.free = null;
  H.locs = {}; H.reviewed = {}; H.locBatch = 0; H.nextLocAt = 0;
  for (const pid of Object.keys(H.players)) if (!H.players[pid].online) delete H.players[pid];
  S.images = {};
  hostBroadcast({t:'reset'});
  commit();
}

function hostKick(pid) {
  if (pid === S.me.pid) return;
  for (const [cid, p] of Object.entries(connPid)) if (p === pid && cid !== 'self') { S.net.send(cid, {t:'kicked'}); S.net.close(cid); delete connPid[cid]; }
  delete H.players[pid]; commit();
}

setInterval(() => {
  if (S.isHost && H && H.phase === 'draft' && H.draftEnds && Date.now() >= H.draftEnds) return hostFinishDraft();
  if (!S.isHost || !H || H.phase !== 'game') return;
  if (H.endsAt && Date.now() >= H.endsAt) return hostEnd('⏰ Die Zeit ist abgelaufen!');
  if (H.nextLocAt && Date.now() >= H.nextLocAt) {
    giveBatch();
    H.nextLocAt += H.settings.locEvery * 60000;
    if ((H.endsAt && H.nextLocAt >= H.endsAt) || (H.settings.maxLocs && H.locBatch >= H.settings.maxLocs)) H.nextLocAt = 0;
    announce('🗺 Neue Auswahl: Wähle deinen ' + H.locBatch + '. Ort!', '#35c873', true);
    commit();
  }
}, 500);

/* ============================================================
   Client
   ============================================================ */
function joinGame(code, name) {
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 5) { S.err = 'Der Code hat 5 Zeichen.'; return render(); }
  S.me.name = name; store.set('name', name);
  S.isHost = false; S.code = code; S.view = 'connecting'; S.err = ''; render();
  S.net = createClientNet(code, {
    onOpen() { S.net.send({t:'hello', pid:S.me.pid, name}); location.hash = code; },
    onMsg: clientMsg,
    onClose() { if (S.view === 'kicked') return; S.state = null; S.view = 'lost'; render(); },
    onError(e) { S.state = null; S.view = 'home'; S.err = e; render(); }
  });
}

function clientMsg(msg) {
  if (!msg || typeof msg !== 'object') return;
  switch (msg.t) {
    case 'state':
      S.offset = msg.now - Date.now(); S.state = msg.state; render(); break;
    case 'img':
      S.images[msg.fid] = msg.data; if (S.state) render(); break;
    case 'reset':
      if (!S.isHost) S.images = {}; break;
    case 'chat':
      S.chat.push(msg.m); if (S.chat.length > 200) S.chat.shift(); renderChat(); break;
    case 'chathist':
      S.chat = msg.list || []; renderChat(); break;
    case 'event':
      toast(msg.text, msg.color, msg.big); break;
    case 'toast':
      toast(msg.text, '#ff5d6c'); break;
    case 'kicked':
      S.state = null; S.view = 'kicked'; render(); break;
    case 'joker':
      S.jokerSwap = msg; break;
  }
}

function svURL(l) {
  return `https://maps.google.com/maps?q=&layer=c&cbll=${l.lat},${l.lng}&cbp=11,${l.h},0,0,0&source=embed&output=svembed`;

/* Teleport: zufälliger Punkt im Umkreis (km) um den ursprünglichen Startpunkt */
function teleport() {
  const loc = myLocs().find(l => l.id === S.curLoc); const R = S.state.settings.tpRadius; if (!loc || !R) return;
  const r = R * Math.sqrt(Math.random()), a = Math.random() * 2 * Math.PI;
  const lat = loc.lat + (r * Math.cos(a)) / 111.32;
  const lng = loc.lng + (r * Math.sin(a)) / (111.32 * Math.cos(loc.lat * Math.PI / 180));
  S.tp[loc.id] = { lat: +lat.toFixed(6), lng: +lng.toFixed(6), h: Math.floor(Math.random() * 360) };
  showLoc(loc.id, true);
  toast(`🎯 Teleportiert (${(r).toFixed(1).replace('.', ',')} km vom Startpunkt)`);
}
function showLoc(id, fresh) {
  const base = myLocs().find(l => l.id === id); if (!base) return;
  const loc = { ...base, ...(S.tp[id] || {}) };
  const wrap = $('#svwrap'); if (!wrap) return;
  let fr = S.frames.get(id);
  if (fr && fresh) { fr.remove(); S.frames.delete(id); fr = null; }
  if (!fr) {
    fr = document.createElement('iframe');
    fr.title = 'Street View ' + loc.n; fr.allowFullscreen = true; fr.referrerPolicy = 'no-referrer-when-downgrade';
    fr.src = svURL(loc);
    wrap.insertBefore(fr, $('#mapOv'));
    S.frames.set(id, fr);
  }
  S.lru = S.lru.filter(x => x !== id); S.lru.push(id);
  while (S.frames.size > MAX_FRAMES) { const old = S.lru.shift(); const f = S.frames.get(old); if (f) f.remove(); S.frames.delete(old); }
  S.frames.forEach((f, k) => f.classList.toggle('off', k !== id));
  S.curLoc = id; S.visited.add(id);
  $('#svEmpty').classList.add('hidden');
  $('#gm').href = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${loc.lat},${loc.lng}&heading=${loc.h}`;
  toggleMap(false);

}

const addScript = src => new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });

/* TopoJSON → GeoJSON (kleiner eigener Decoder) */
function topoFeatures(topo, obj) {
  const tf = topo.transform;
  const arcs = topo.arcs.map(arc => { let x = 0, y = 0; return arc.map(p => {
    if (!tf) return p.slice(0, 2);
    x += p[0]; y += p[1]; return [x * tf.scale[0] + tf.translate[0], y * tf.scale[1] + tf.translate[1]];
  }); });
  const arc = i => i < 0 ? arcs[~i].slice().reverse() : arcs[i];
  const ring = ids => { const pts = []; ids.forEach((i, k) => { const a = arc(i); pts.push(...(k ? a.slice(1) : a)); }); return pts; };
  const geom = g => g.type === 'Polygon' ? {type:'Polygon', coordinates:g.arcs.map(ring)}
    : g.type === 'MultiPolygon' ? {type:'MultiPolygon', coordinates:g.arcs.map(p => p.map(ring))} : null;
  return { type:'FeatureCollection', features: obj.geometries.map(g => ({type:'Feature', properties:g.properties || {}, geometry:geom(g)})).filter(f => f.geometry) };
}
/* Länderumrisse (Natural Earth über world-atlas) – keine Kartenkacheln, kein API-Schlüssel */
let worldP = null;
function loadWorld() {
  if (worldP) return worldP;
  worldP = fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')
    .catch(() => fetch('https://unpkg.com/world-atlas@2.0.2/countries-110m.json'))
    .then(r => r.json())
    .then(t => topoFeatures(t, t.objects.countries));
  worldP.catch(() => { worldP = null; });
  return worldP;
}
function initMap() {

function buildMap() {
  const el = $('#wmap');
  const svg = d3.select(el).append('svg');
  const gRoot = svg.append('g'), gBase = gRoot.append('g'), gMk = svg.append('g');
  const M = S.map = { el, svg, gRoot, gBase, gMk, t: d3.zoomIdentity, proj: d3.geoNaturalEarth1(), world: null, items: [] };
  M.zoom = d3.zoom().scaleExtent([1, 16]).on('zoom', e => { M.t = e.transform; gRoot.attr('transform', M.t); placeMarkers(); });
  svg.call(M.zoom);
  const zb = document.createElement('div'); zb.className = 'wzoom';
  zb.innerHTML = '<button class="small" data-z="1.8" aria-label="Hineinzoomen">+</button><button class="small" data-z="0.55" aria-label="Herauszoomen">−</button><button class="small" data-z="0" title="Ganze Welt">⤢</button>';
  zb.onclick = e => { const b = e.target.closest('[data-z]'); if (!b) return; const z = +b.dataset.z;
    if (z) M.svg.transition().duration(300).call(M.zoom.scaleBy, z); else M.svg.transition().duration(500).call(M.zoom.transform, d3.zoomIdentity); };
  el.appendChild(zb);

  loadWorld().then(w => { if (S.map !== M) return; M.world = w; drawBase(); })
    .catch(() => toast('Länderumrisse konnten nicht geladen werden – die Orte sind trotzdem auf der Karte.', '#ff5d6c'));

function layoutMap() {
  const M = S.map; if (!M) return;

  if (w === M.w && h === M.h) return;
  M.w = w; M.h = h;
  M.svg.attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h);
  // Karte füllt das ganze Fenster (keine leeren Streifen); verschieben/zoomen bleibt innerhalb der Weltkugel
  M.proj.fitExtent([[0, 0], [w, h]], {type:'Sphere'});

function fitMap(force) {

let capStream = null, capVideo = null;
async function ensureStream() {
  if (capStream && capStream.active) return;
  capStream = await navigator.mediaDevices.getDisplayMedia({ video:{ displaySurface:'browser', frameRate:15 }, audio:false, preferCurrentTab:true, selfBrowserSurface:'include', surfaceSwitching:'exclude' });
  capVideo = document.createElement('video'); capVideo.muted = true; capVideo.playsInline = true; capVideo.srcObject = capStream;
  await capVideo.play();
  capStream.getVideoTracks()[0].addEventListener('ended', () => { capStream = null; });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toJpeg(src, sx, sy, sw, sh) {
  const maxW = 1100; const k = Math.min(1, maxW / sw);
  const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  c.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  let q = 0.78, url = c.toDataURL('image/jpeg', q);
  while (url.length > 420000 && q > 0.35) { q -= 0.1; url = c.toDataURL('image/jpeg', q); }
  return url;
}
async function grabStreetView(crop) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) throw new Error('Dein Browser unterstützt keine Bildschirmaufnahme. Nutze Screenshot + Strg+V.');
  await ensureStream();
  const m = $('#modal'); m.style.visibility = 'hidden';
  await sleep(350);
  try {
    const vw = capVideo.videoWidth, vh = capVideo.videoHeight;
    let sx = 0, sy = 0, sw = vw, sh = vh;
    const kx = vw / innerWidth, ky = vh / innerHeight;
    if (crop && Math.abs(kx - ky) / kx < 0.08) {
      const r = $('#svwrap').getBoundingClientRect();
      sx = Math.max(0, r.left * kx); sy = Math.max(0, r.top * ky); sw = Math.min(vw - sx, r.width * kx); sh = Math.min(vh - sy, r.height * ky);
    }
    return toJpeg(capVideo, sx, sy, sw, sh);
  } finally { m.style.visibility = ''; }
}
async function fileToJpeg(file) {
  const bmp = await createImageBitmap(file);
  return toJpeg(bmp, 0, 0, bmp.width, bmp.height);
}

function thumbHTML(st, fid, f) {

}

  const el = $('#dTimer'); if (!el || !S.state || S.state.phase !== 'draft') return;
  const st = S.state;
  if (!st.draftEnds) { el.textContent = ''; return; }
  const left = st.draftEnds - (Date.now() + S.offset);
  el.textContent = fmtTime(left); el.classList.toggle('warn', left < 15000);
}
setInterval(tickDraft, 250);
UPDATE.draft = () => {
  const st = S.state; const need = wordsNeeded(st.settings);
  const rank = draftRanking(st); const inSet = new Set(rank.slice(0, need).map(r => r.i));
  const cutoff = rank[need - 1] ? rank[need - 1].score : 0;
  $('#dNeed').textContent = `Die ${need} Begriffe mit den meisten Stimmen kommen auf die ${st.settings.size}×${st.settings.size}-Karte.`;
  const myVotes = st.draftWords.map((_, i) => ((st.draftVotes[i] || {})[S.me.pid]) || 0);
  $('#dSub').textContent = `Du hast ${myVotes.filter(x => x).length} von ${st.draftWords.length} bewertet.`;
  $('#dGrid').innerHTML = rank.slice().sort((a, b) => a.i - b.i).map(r => {
    const mv = myVotes[r.i];
    const edge = r.score === cutoff;
    return `<div class="dcard ${inSet.has(r.i) ? 'in' : ''}">
      <div class="dw">${esc(r.w)}</div>
      <div class="dmeta"><span class="dscore ${r.score > 0 ? 'pos' : r.score < 0 ? 'neg' : ''}">${r.score > 0 ? '+' : ''}${r.score}</span>
        <span class="muted">${r.up}👍 ${r.down}👎</span>${inSet.has(r.i) ? `<span class="din" title="${edge ? 'Knapp – kann noch rausfallen' : ''}">auf der Karte${edge ? ' ?' : ''}</span>` : ''}</div>
      <div class="dbtns"><button class="small up ${mv > 0 ? 'on' : ''}" data-i="${r.i}" data-dv="1" aria-label="Upvote">👍</button><button class="small down ${mv < 0 ? 'on' : ''}" data-i="${r.i}" data-dv="-1" aria-label="Downvote">👎</button></div>
    </div>`;
  }).join('');
  const online = Object.keys(st.players).filter(p => st.players[p].online);
  const ready = online.filter(p => (st.draftReady || {})[p]);
  const meReady = !!(st.draftReady || {})[S.me.pid];
  $('#dReadyInfo').textContent = `${ready.length}/${online.length} fertig`;
  const rb = $('#dReady'); rb.textContent = meReady ? 'Doch nicht fertig' : 'Fertig ✓'; rb.className = meReady ? '' : 'btn-primary';
  $('#dHost').innerHTML = amHost() ? '<button id="dEnd">Draft beenden & starten</button>' : '';
  if (amHost()) $('#dEnd').onclick = hostFinishDraft;
  tickDraft();
};

/* ---------- Abstimmung ---------- */
MOUNT.vote = () => {
  app.innerHTML = `<header class="top">${logoHTML(true)}<h2 style="margin:0">Abstimmung</h2><span class="muted" id="vprog"></span><span class="grow"></span><span class="muted" id="vreason"></span></header>
    <main class="vote"><div class="card vote-main" id="vmain"></div><div class="strip" id="vstrip"></div></main>`;
};
addEventListener('keydown', e => voteKeys(e));
function voteKeys(e) {
  if (!S.state || !['vote', 'intermission'].includes(S.state.phase) || e.target.matches('input,textarea') || !$('#modal').classList.contains('hidden')) return;
  const b = e.key === 'j' || e.key === 'y' ? $('.vote-bar .yes') : e.key === 'n' ? $('.vote-bar .no') : null;
  if (b && !b.disabled) b.click();
  if (amHost() && e.key === 'ArrowRight') $('#vNext')?.click();
  if (amHost() && e.key === 'ArrowLeft') $('#vPrev')?.click();
}
UPDATE.vote = () => renderVote(false);
function renderVote(isInter) {
  const st = S.state; const order = st.voteOrder; const idx = Math.min(st.voteIdx, order.length - 1);
  const fid = order[idx]; const f = st.findings[fid]; if (!f) return;
  const sd = sideInfo(st, f.side);
  const v = st.votes[fid] || {}; const y = Object.values(v).filter(x => x > 0).length, n = Object.values(v).filter(x => x < 0).length;
  const elig = eligibleVoters(st, f); const canVote = elig.includes(S.me.pid); const myV = v[S.me.pid] || 0;
  const missing = elig.filter(p => !(p in v)).map(p => st.players[p]?.name).filter(Boolean);
  $('#vprog').textContent = `Foto ${idx + 1} von ${order.length}`;
  if ($('#vreason')) $('#vreason').textContent = st.endReason || '';
  $('#vmain').innerHTML = `
    <div class="vote-head"><span class="pill" style="--c:${sd.color}">${esc(sd.name)}</span><h2>„${esc(st.board[f.cell])}“</h2><span class="muted">gefunden von ${esc(st.players[f.pid]?.name || '?')}</span></div>
    ${S.images[fid] ? `<img class="vote-img" src="${S.images[fid]}" alt="" data-zoom="${fid}">` : '<div class="capprev"><div class="ph">Bild wird geladen …</div></div>'}
    <div class="vote-bar">
      ${canVote ? `<button class="yes ${myV > 0 ? 'on' : ''}" data-v="1">✓ Zählt <kbd>J</kbd></button><button class="no ${myV < 0 ? 'on' : ''}" data-v="-1">✗ Zählt nicht <kbd>N</kbd></button>`
                : `<span class="muted">Bei Fotos ${st.settings.mode === 'team' ? 'deines Teams' : 'von dir'} stimmen die anderen ab.</span>`}
      <span class="grow"></span>
      <div class="tally"><span class="y">✓ ${y}</span><span class="n">✗ ${n}</span><span class="muted" style="font-weight:500">${y >= n ? 'zählt' : 'zählt nicht'}</span></div>
    </div>
    <div class="muted" style="font-size:13px">${missing.length ? 'Noch offen: ' + esc(missing.join(', ')) : 'Alle haben abgestimmt.'} · Gleichstand zählt als gültig.</div>
    ${amHost() ? `<div class="row" style="flex-wrap:wrap"><button id="vPrev" ${idx === 0 ? 'disabled' : ''}>◀ Zurück</button><button class="btn-primary" id="vNext" ${idx >= order.length - 1 ? 'disabled' : ''}>Nächstes Foto ▶</button><span class="grow"></span><button id="vFinish" class="${idx >= order.length - 1 ? 'btn-primary' : ''}">${isInter ? 'Weiter spielen ▶' : 'Ergebnis zeigen'}</button></div>`
      : '<div class="muted" style="font-size:13px">Der Host blättert durch die Fotos.</div>'}`;
  $$('.vote-bar [data-v]').forEach(b => b.onclick = () => act({t:'vote', fid, v: +b.dataset.v === myV ? 0 : +b.dataset.v}));
  $$('[data-zoom]').forEach(t => t.onclick = () => lightbox(t.dataset.zoom));
  if (amHost()) {
    $('#vPrev').onclick = () => { H.voteIdx = Math.max(0, idx - 1); commit(); };
    $('#vNext').onclick = () => { H.voteIdx = Math.min(order.length - 1, idx + 1); commit(); };
    $('#vFinish').onclick = () => { if (isInter) hostResume(); else { H.phase = 'results'; commit(); } };
  }
  $('#vstrip').innerHTML = order.map((id, i) => {
    const ff = st.findings[id]; const vv = st.votes[id] || {}; const yy = Object.values(vv).filter(x => x > 0).length, nn = Object.values(vv).filter(x => x < 0).length;
    return `<button data-jump="${i}" class="${i === idx ? 'cur' : ''}" style="border-bottom:3px solid ${sideInfo(st, ff.side).color}" title="${esc(st.board[ff.cell])}">${S.images[id] ? `<img src="${S.images[id]}" alt="">` : '<div style="width:92px;height:58px"></div>'}<span class="st">${Object.keys(vv).length ? (yy >= nn ? '✓' : '✗') : '·'}</span></button>`;
  }).join('');
  $$('[data-jump]').forEach(b => b.onclick = () => { if (amHost()) { H.voteIdx = +b.dataset.jump; commit(); } });
  const cur = $('#vstrip .cur'); if (cur) cur.scrollIntoView({block:'nearest', inline:'center'});
}

/* ---------- Ergebnis ---------- */
MOUNT.results = () => {
  app.innerHTML = `<header class="top">${logoHTML(true)}<h2 style="margin:0">Ergebnis</h2><span class="grow"></span><span id="resCtl"></span></header><main class="results" id="res"></main>`;
};
UPDATE.results = () => {
  const st = S.state; const res = standings(st); const n = st.board.length; const size = Math.round(Math.sqrt(n));
  const winners = res.filter(r => r.win);
  const wc = winners.length === 1 ? winners[0].color : '#ffb020';
  const banner = !winners.length ? 'Niemand hat ein gültiges Feld 🤷' : winners.length > 1 ? 'Unentschieden: ' + winners.map(w => esc(w.name)).join(' & ') : esc(winners[0].name) + ' gewinnt!';
  $('#resCtl').innerHTML = amHost() ? '<button class="btn-primary" id="again">Neue Runde</button>' : '<span class="muted">Der Host kann eine neue Runde starten.</span>';
  if (amHost()) $('#again').onclick = hostToLobby;
  const fids = Object.keys(st.findings).sort((a, b) => st.findings[a].cell - st.findings[b].cell);
  $('#res').innerHTML = `
    <div class="winner" style="--c:${wc}"><div class="muted">${esc(st.endReason || '')}</div><div class="display">🏆 ${banner}</div>
      <div class="muted">Siegbedingung: ${WIN_NAMES[st.settings.win]}</div></div>
    <div class="rgrid">${res.map(r => `
      <div class="card rcard" style="--c:${r.color}">
        <div class="rh"><span class="rank">#${r.rank}</span><span class="pill" style="--c:${r.color}">${esc(r.name)}</span>${r.win ? '<span>🏆</span>' : ''}</div>
        ${st.settings.mode === 'team' ? `<div class="muted" style="font-size:13px">${r.members.map(p => esc(st.players[p]?.name)).join(', ') || '–'}</div>` : ''}
        <div class="stats"><div><b>${r.cells}</b>Felder</div><div><b>${r.lines}</b>Reihen</div><div><b>${Object.values(st.findings).filter(f => f.side === r.id).length}</b>Fotos</div></div>
        <div class="mini" style="--n:${size}">${layoutOf(st, r.id).map(i => {
          const w = st.board[i];
          if (i === st.free) return '<span class="f" title="FREI"></span>';
          const all = Object.entries(st.findings).filter(([, f]) => f.side === r.id && f.cell === i);
          const ok = all.some(([fid]) => isValid(st, fid));
          return `<span class="${ok ? 'v' : all.length ? 'x' : ''} ${r.lineCells.has(i) ? 'l' : ''}" title="${esc(w)}"></span>`;
        }).join('')}</div>
      </div>`).join('')}</div>
    <h2>Alle Fotos</h2>
    ${fids.length ? `<div class="gallery">${fids.map(fid => {
      const f = st.findings[fid]; const sd = sideInfo(st, f.side); const ok = isValid(st, fid);
      return `<div class="gitem ${ok ? '' : 'rej'}" data-zoom="${fid}" style="--c:${sd.color}">${S.images[fid] ? `<img src="${S.images[fid]}" alt="">` : '<div style="aspect-ratio:16/10"></div>'}
        <div class="gi"><b>${esc(st.board[f.cell])}</b><span class="muted">${esc(st.players[f.pid]?.name || '?')}</span><span>${ok ? '✅' : '❌'}</span></div></div>`;
    }).join('')}</div>` : '<p class="muted">Keine Fotos in dieser Runde.</p>'}`;
  $$('[data-zoom]').forEach(t => t.onclick = () => lightbox(t.dataset.zoom));
};

/* ---------- Start ---------- */
addEventListener('beforeunload', e => { if (S.isHost && H && Object.keys(H.players).length > 1) { e.preventDefault(); e.returnValue = ''; } });
handleAuthReturn(); // entfernt Login-Tokens aus der Adresse, bevor die Seite gezeichnet wird
render();
</script>
</body>
</html>
