function startHost(name, opts = {}) {
  S.me.name = name; store.set('name', name);
  S.isHost = true; S.view = 'connecting'; render();
  const tryCode = (attempt) => {
    const code = opts.code || genCode();
    H = {
      phase:'lobby', code, hostPid:S.me.pid, ranked: opts.ranked || null, createdAt: Date.now(),
      settings: opts.settings ? { ...opts.settings } : {...DEFAULT_SETTINGS, ...store.get('settings', {}), teamNames:[...(store.get('settings', {}).teamNames || DEFAULT_SETTINGS.teamNames)]},
      players:{}, board:[], free:null, findings:{}, votes:{}, voteOrder:[], voteIdx:0, endsAt:0, startedAt:0, endReason:'', round:0, lineCount:{}, nextCi:0,
      locs:{}, locBatch:0, nextLocAt:0, reviewed:{}, sinceReview:0, pausedAt:0, jokers:{}
    };
    const myAcc = account(); const rp = H.ranked && myAcc ? H.ranked.players.find(x => x.uid === myAcc.uid) : null;
    H.players[S.me.pid] = { name, team: rp && H.settings.mode === 'team' ? rp.team : null, online:true, ci: H.nextCi++, acct: myAcc ? myAcc.uid : null, avatar: myAvatar() };
    connPid.self = S.me.pid; for (const k in HSEC) delete HSEC[k]; HSEC[S.me.pid] = S.me.sec;
    S.net = createHostNet(code, {
      onReady() { S.code = code; S.state = H; location.hash = code; render(); },
      onError(e) {
        if (e && e.type === 'unavailable-id' && attempt < 3 && !opts.code) return tryCode(attempt + 1);
        if (S.state) { if (e && e.type === 'network') toast('Netzwerkproblem – versuche neu zu verbinden …', '#ff5d6c'); return; }
        S.isHost = false; S.view = 'home'; S.err = 'Lobby konnte nicht erstellt werden (' + (e && (e.type || e.message)) + ').'; render();
      },
      onConn() {},
      onMsg: hostHandle,
      onClose(cid) {
        const pid = connPid[cid]; delete connPid[cid]; if (!pid || !H.players[pid]) return;
        if (Object.values(connPid).includes(pid)) return; // noch anders verbunden
        if (H.phase === 'lobby') delete H.players[pid]; else H.players[pid].online = false;
        commit();
      }
    });
  };
  tryCode(0);
}

const SFX = { ctx: null, on: store.get('sound', true) };
function audioCtx() {
  try { SFX.ctx = SFX.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (SFX.ctx.state === 'suspended') SFX.ctx.resume(); } catch { SFX.ctx = null; }
  return SFX.ctx;
}
addEventListener('pointerdown', () => { if (SFX.on && (!SFX.ctx || SFX.ctx.state === 'suspended')) audioCtx(); }, { passive:true });
function sfx(name) {
  const seq = SOUNDS[name]; if (!SFX.on || !seq) return;
  const c = audioCtx(); if (!c) return;
  const t0 = c.currentTime + .02;
  for (const [f, st, dur, type, vol] of seq) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t0 + st);
    g.gain.setValueAtTime(.0001, t0 + st); g.gain.exponentialRampToValueAtTime(vol || .16, t0 + st + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + st + dur);
    o.connect(g); g.connect(c.destination); o.start(t0 + st); o.stop(t0 + st + dur + .05);
  }
}
function soundBtnHTML() { return `<button class="iconbtn sndbtn" data-snd title="${SFX.on ? 'Ton aus' : 'Ton an'}" aria-label="${SFX.on ? 'Ton aus' : 'Ton an'}">${ic(SFX.on ? 'volume' : 'mute')}</button>`; }
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-snd]'); if (!b) return;
  SFX.on = !SFX.on; store.set('sound', SFX.on);
  $$('[data-snd]').forEach(x => x.outerHTML = soundBtnHTML());
  if (SFX.on) sfx('resume');

function chatTargets(scope) {
  if (scope === 'all') return Object.keys(H.players);
  const t = +scope.slice(1); return Object.keys(H.players).filter(p => H.players[p].team === t);
}
function hostChatPush(entry) {
  hostChat.push(entry); if (hostChat.length > 200) hostChat.shift();
  chatTargets(entry.scope).forEach(p => hostSendTo(p, {t:'chat', m:entry}));
}

function hostHandle(cid, msg) {
  if (!H || !msg || typeof msg !== 'object') return;
  let pid = connPid[cid];
  if (msg.t === 'hello') {
    pid = typeof msg.pid === 'string' && /^[a-z0-9]{6,24}$/.test(msg.pid) ? msg.pid : null;
    const sec = typeof msg.sec === 'string' && /^[a-z0-9]{16,40}$/.test(msg.sec) ? msg.sec : null;
    if (!pid || !sec || (HSEC[pid] && HSEC[pid] !== sec)) { S.net.send(cid, {t:'kicked', reason: !sec ? 'reload' : 'taken'}); S.net.close(cid); return; }
    HSEC[pid] = sec;
    const name = String(msg.name || 'Gast').trim().slice(0, 20) || 'Gast';
    connPid[cid] = pid;
    const acct = typeof msg.acct === 'string' && /^[0-9a-f-]{36}$/.test(msg.acct) ? msg.acct : null;
    let rp = null;
    if (H.ranked) {
      rp = acct && H.ranked.players.find(x => x.uid === acct);
      if (!rp) { S.net.send(cid, {t:'kicked', reason:'ranked'}); S.net.close(cid); delete connPid[cid]; return; }
      for (const [opid, op] of Object.entries(H.players)) if (op.acct === acct && opid !== pid) delete H.players[opid]; // gleicher Spieler, neue Verbindung
    }
    let p = H.players[pid];
    if (!p) {
      p = H.players[pid] = { name, team: rp && H.settings.mode === 'team' ? rp.team : null, online:true, ci: H.nextCi++ };
      if (H.phase !== 'lobby' && H.settings.mode === 'team') {
        const c = [0, 1].map(i => Object.values(H.players).filter(x => x.team === i).length);
        p.team = c[0] <= c[1] ? 0 : 1;
      }
    }
    p.name = name; p.online = true; p.acct = acct; p.avatar = okAvatar(msg.avatar);
    if (H.phase === 'game' || H.phase === 'intermission') ensureLayouts();
    if ((H.phase === 'game' || H.phase === 'intermission') && !(H.locs[pid] || []).length) {
      for (let b = 0; b < Math.max(1, H.locBatch); b++) H.locs[pid] = (H.locs[pid] || []).concat(pickLocs(pid, H.settings.locCount, b));
    }
    S.net.send(cid, {t:'welcome', code:H.code});
    for (const fid of Object.keys(H.findings)) if (S.images[fid]) S.net.send(cid, {t:'img', fid, data:S.images[fid]});
    const t = p.team;
    S.net.send(cid, {t:'chathist', list: hostChat.filter(m => m.scope === 'all' || (t != null && m.scope === 't' + t))});
    hostChatPush({scope:'all', sys:true, text: name + ' ist beigetreten', ts:Date.now()});
    commit(); return;
  }
  if (!pid || !H.players[pid]) return;
  const p = H.players[pid];
  switch (msg.t) {
    case 'team': {
      if (H.settings.mode !== 'team' || H.ranked) return;
      const team = msg.team === 0 || msg.team === 1 ? msg.team : null;
      if (H.phase === 'lobby' || (H.phase === 'game' && p.team == null && team != null)) { p.team = team; commit(); }
      return;
    }
    case 'chat': {
      const text = String(msg.text || '').trim().slice(0, 300); if (!text) return;
      let scope = 'all';
      if (msg.scope === 'team' && H.settings.mode === 'team' && p.team != null) scope = 't' + p.team;
      const sd = sideOf(H, pid);
      hostChatPush({scope, name:p.name, color: sd ? sideInfo(H, sd).color : '#8e9bab', text, ts:Date.now()});
      return;
    }
    case 'capture': {
      if (H.phase !== 'game') return hostSendTo(pid, {t:'toast', text:'Das Spiel läuft gerade nicht.'});
      const cell = msg.cell | 0; const side = sideOf(H, pid);
      if (!side) return hostSendTo(pid, {t:'toast', text:'Wähle zuerst ein Team.'});
      if (cell < 0 || cell >= H.board.length || cell === H.free) return;
      const img = okImg(msg.img);
      if (!img) return hostSendTo(pid, {t:'toast', text:'Bild ungültig oder zu groß.'});
      if (H.settings.lockout) {
        const other = Object.entries(H.findings).map(([id, f]) => isValid(H, id) && f).find(f => f && f.cell === cell && f.side !== side);
        if (other) return hostSendTo(pid, {t:'toast', text:'Zu spät – dieses Feld hat schon ' + sideInfo(H, other.side).name + '.'});
      }
      for (const [fid, f] of Object.entries(H.findings)) if (f.pid === pid && f.cell === cell) { delete H.findings[fid]; delete S.images[fid]; }
      const fid = uid(10);
      S.images[fid] = img;
      S.net.broadcast({t:'img', fid, data:img});
      H.findings[fid] = { pid, side, cell, ts:Date.now() };
      H.sinceReview++;
      const sd = sideInfo(H, side);
      announce((H.settings.mode === 'team' ? p.name + ' (' + sd.name + ')' : p.name) + ' hat „' + H.board[cell] + '“ gefunden – wird noch geprüft', sd.color, false, 'found');
      hostCheckLines();
      if (H.phase === 'game' && H.settings.voting && H.settings.interEvery && H.sinceReview >= H.settings.interEvery) return hostIntermission();
      commit(); return;
    }
    case 'remove': {
      if (H.phase !== 'game') return;
      const f = H.findings[msg.fid]; if (!f || f.pid !== pid) return;
      delete H.findings[msg.fid]; const sz = Math.round(Math.sqrt(H.board.length));
      H.lineCount[f.side] = Math.min(H.lineCount[f.side] || 0, lineInfo(sz, claimed(H, f.side, 'confirmed'), layoutOf(H, f.side)).count);
      H.pLineCount = H.pLineCount || {}; H.pLineCount[f.side] = Math.min(H.pLineCount[f.side] || 0, lineInfo(sz, claimed(H, f.side, true), layoutOf(H, f.side)).count);
      commit(); return;
    }
    case 'choose': {
      if (H.phase !== 'game') return;
      const list = H.locs[pid] || []; const l = list.find(x => x.id === msg.id);
      if (!l || l.ch || list.some(x => x.b === l.b && x.ch)) return;
      l.ch = true;
      H.locs[pid] = list.filter(x => x.b !== l.b || x.ch); // die anderen Vorschläge verschwinden
      commit(); return;
    }
    case 'joker': {
      if (H.phase !== 'game') return;
      const left = H.settings.jokers - (H.jokers[pid] || 0);
      const list = H.locs[pid] || []; const i = list.findIndex(l => l.id === msg.id && l.ch);
      if (left <= 0 || i < 0) return;
      const repl = pickLocs(pid, 1, list[i].b)[0]; if (!repl) return;
      repl.ch = true; list[i] = repl; H.jokers[pid] = (H.jokers[pid] || 0) + 1;
      hostSendTo(pid, {t:'joker', from:msg.id, to:repl.id});
      commit(); return;
    }
    case 'dvote': {
      if (H.phase !== 'draft') return;
      const i = msg.i | 0; if (i < 0 || i >= H.draftWords.length) return;
      H.draftVotes[i] = H.draftVotes[i] || {};
      if (msg.v === 1 || msg.v === -1) H.draftVotes[i][pid] = msg.v; else delete H.draftVotes[i][pid];
      commitSoon(); return;
    }
    case 'dready': {
      if (H.phase !== 'draft') return;
      if (msg.r) H.draftReady[pid] = true; else delete H.draftReady[pid];
      const online = Object.keys(H.players).filter(p => H.players[p].online);
      if (online.length && online.every(p => H.draftReady[p])) return hostFinishDraft();
      commit(); return;
    }
    case 'vote': {
      if (H.phase !== 'vote' && H.phase !== 'intermission') return;
      const f = H.findings[msg.fid]; if (!f || !H.voteOrder.includes(msg.fid)) return;
      if (!eligibleVoters(H, f).includes(pid)) return;
      H.votes[msg.fid] = H.votes[msg.fid] || {};
      if (msg.v === 1 || msg.v === -1) H.votes[msg.fid][pid] = msg.v; else delete H.votes[msg.fid][pid];
      if (H.voteOrder[H.voteIdx] === msg.fid && eligibleVoters(H, f).every(p => p in H.votes[msg.fid])) H.voteEndsAt = Math.min(H.voteEndsAt || Infinity, Date.now() + 1500);
      commit(); return;
    }
  }
}

/* Sieg nur mit geprüften Fotos. Wäre mit vorläufigen Fotos ein Bingo erreicht, startet ein Bingo-Check:
   alle offenen Fotos werden geprüft – zählen sie, gibt es einen Gewinner, sonst geht das Spiel weiter. */
function hostCheckLines() {
  const size = Math.round(Math.sqrt(H.board.length)), n = H.board.length, win = H.settings.win, vote = H.settings.voting;
  H.pLineCount = H.pLineCount || {};
  for (const sd of sides(H)) {
    const lay = layoutOf(H, sd.id);
    const conf = claimed(H, sd.id, 'confirmed'), prov = claimed(H, sd.id, true);
    const lc = lineInfo(size, conf, lay).count, lp = lineInfo(size, prov, lay).count;
    if (lc > (H.lineCount[sd.id] || 0)) {
      H.lineCount[sd.id] = lc;
      if (win === 'line') return hostEnd('BINGO! ' + sd.name + ' hat eine volle Reihe!', sd.color);
      announce('BINGO! ' + sd.name + ' hat ' + (lc === 1 ? 'eine Reihe' : lc + ' Reihen') + '!', sd.color, true, 'bingo');
    }
    if (win === 'full' && conf.size === n) return hostEnd(sd.name + ' hat die volle Karte!', sd.color);
    if (!vote) continue;
    if (lp > Math.max(lc, H.pLineCount[sd.id] || 0)) {
      H.pLineCount[sd.id] = lp;
      if (win === 'line') return hostIntermission('bingo', sd);
      announce('Mögliches Bingo für ' + sd.name + ' – zählt, sobald die Fotos geprüft sind.', sd.color, true, 'maybe');
    }
    if (win === 'full' && prov.size === n) return hostIntermission('bingo', sd);
  }
}

/* ---------- Wort-Draft ---------- */
const hasFree = () => false; // kein Freifeld – jedes Feld ist ein Begriff
const wordsNeeded = s => s.size * s.size - (hasFree(s) ? 1 : 0);
function draftRanking(st) {
  // Punkte = Upvotes − Downvotes; bei Gleichstand entscheidet die (zufällige) Reihenfolge der Liste
  return st.draftWords.map((w, i) => {
    const v = Object.values(st.draftVotes[i] || {});
    return { w, i, up: v.filter(x => x > 0).length, down: v.filter(x => x < 0).length };
  }).map(r => ({ ...r, score: r.up - r.down }))
    .sort((a, b) => b.score - a.score || a.i - b.i);
}
function hostStart() {
  const s = H.settings; const need = wordsNeeded(s);
  let pool = shuffle(wordPool(s));
  if (pool.length < need) pool = [...pool, ...shuffle(WORDS.filter(w => !pool.includes(w)))];
  if (!s.draft) return hostBeginGame(pool.slice(0, need));
  for (const pid of Object.keys(H.players)) if (!H.players[pid].online) delete H.players[pid];
  let cands = pool.slice(0, need * 2);
  if (cands.length < need * 2) cands = [...cands, ...shuffle(WORDS.filter(w => !cands.includes(w)))].slice(0, need * 2);
  H.phase = 'draft'; H.draftWords = cands; H.draftVotes = {}; H.draftReady = {};
  H.draftEnds = s.draftTime ? Date.now() + s.draftTime * 1000 : 0;
  hostBroadcast({t:'reset'});
  announce('🗳 Wort-Draft! Stimmt ab, welche Begriffe auf die Karte kommen.', '#ffb020', true, 'draft');
  commit();
}
function hostFinishDraft() {
  if (H.phase !== 'draft') return;
  const need = wordsNeeded(H.settings);
  hostBeginGame(draftRanking(H).slice(0, need).map(r => r.w));
}
function hostBeginGame(words) {
  const s = H.settings; const n = s.size * s.size;
  H.board = shuffle(words).slice(0, n);
  H.free = hasFree(s) ? Math.floor(n / 2) : null;
  if (H.free != null) H.board.splice(H.free, 0, 'FREI');
  H.board = H.board.slice(0, n);
  H.draftWords = []; H.draftVotes = {}; H.draftReady = {}; H.draftEnds = 0;
  H.layouts = {};
  H.findings = {}; H.votes = {}; H.voteOrder = []; H.voteIdx = 0; H.lineCount = {}; H.pLineCount = {}; H.checkKind = null; H.checkSide = null; H.endReason = '';
  H.reviewed = {}; H.sinceReview = 0; H.pausedAt = 0; H.jokers = {}; H.locs = {}; H.locBatch = 0;
  S.images = {};
  for (const pid of Object.keys(H.players)) if (!H.players[pid].online) delete H.players[pid];
  H.phase = 'game'; H.round++; H.startedAt = Date.now();
  ensureLayouts();
  H.endsAt = s.minutes ? Date.now() + s.minutes * 60000 : 0;
  giveBatch();
  H.nextLocAt = s.locEvery && s.maxLocs !== 1 ? Date.now() + s.locEvery * 60000 : 0;
  if (H.endsAt && H.nextLocAt >= H.endsAt) H.nextLocAt = 0;
  hostBroadcast({t:'reset'});
  announce('Los geht’s! Wähle auf der Weltkarte einen deiner Orte.', '#ffb020', true, 'start');
  commit();
}

/* Zufällige Orte für einen Spieler (ohne Wiederholung, solange möglich) */
function pickLocs(pid, n, batch) {
  const pool = regionLocs(H.settings.region);
  const used = new Set((H.locs[pid] || []).map(l => l.n));
  let avail = pool.filter(l => !used.has(l[2]));
  if (avail.length < n) avail = pool;
  // Feste, geprüfte Startpunkte (Google-Außenaufnahme mit Straße, kein 360°-Foto aus Läden) – nur die Blickrichtung ist zufällig
  return shuffle(avail).slice(0, n).map(l => ({
    id: uid(8), c: l[1], n: l[2], lat: l[3], lng: l[4], h: Math.floor(Math.random() * 360), b: batch
  }));
}
function giveBatch() {
  if (H.settings.maxLocs && H.locBatch >= H.settings.maxLocs) return;
  H.jokers = {}; // Joker füllen sich mit jeder neuen Auswahl wieder auf
  for (const pid of Object.keys(H.players)) H.locs[pid] = (H.locs[pid] || []).concat(pickLocs(pid, H.settings.locCount, H.locBatch));
  H.locBatch++;
}

/* Zwischenrunde: neue Fotos prüfen, Zeit pausiert */
function unreviewed() {
  return Object.keys(H.findings).filter(f => !H.reviewed[f])
    .sort((a, b) => H.findings[a].cell - H.findings[b].cell || H.findings[a].side.localeCompare(H.findings[b].side) || H.findings[a].ts - H.findings[b].ts);
}
/* Abstimmung: 15 Sekunden pro Foto, danach automatisch weiter (haben alle abgestimmt, schon nach 1,5 s) */
const VOTE_SECS = 15;
function hostSetVoteIdx(i) { H.voteIdx = i; H.voteEndsAt = Date.now() + VOTE_SECS * 1000; }
function hostVoteFinish() {
  if (H.phase === 'intermission') return hostResume();
  if (H.phase === 'vote') { H.phase = 'results'; H.voteEndsAt = 0; commit(); }
}
function hostVoteTick() {
  if (!S.isHost || !H || (H.phase !== 'vote' && H.phase !== 'intermission') || !H.voteEndsAt || Date.now() < H.voteEndsAt) return;
  if (H.voteIdx < H.voteOrder.length - 1) { hostSetVoteIdx(H.voteIdx + 1); commit(); }
  else hostVoteFinish();
}
setInterval(hostVoteTick, 250);
function hostIntermission(kind, sd) {
  const order = unreviewed(); H.sinceReview = 0;
  if (!order.length) return commit();
  H.phase = 'intermission'; H.pausedAt = Date.now(); H.voteOrder = order; hostSetVoteIdx(0);
  H.checkKind = kind === 'bingo' ? 'bingo' : 'check'; H.checkSide = sd ? sd.id : null;
  if (H.checkKind === 'bingo') announce('Mögliches Bingo von ' + sd.name + '! Prüft jetzt die Fotos – zählen sie, ist das Spiel gewonnen.', sd.color, true, 'maybe');
  else announce('⏸ Zwischenrunde! Prüft die neuen Fotos.', '#ffb020', true, 'check');
  commit();
}
function hostResume() {
  if (H.phase !== 'intermission') return;
  const d = Date.now() - H.pausedAt;
  if (H.endsAt) H.endsAt += d;
  if (H.nextLocAt) H.nextLocAt += d;
  const checked = H.voteOrder.slice();
  H.voteOrder.forEach(f => H.reviewed[f] = true);
  const kind = H.checkKind; H.checkKind = null; H.checkSide = null;
  H.phase = 'game'; H.pausedAt = 0; H.voteOrder = []; H.voteIdx = 0; H.voteEndsAt = 0;
  const size = Math.round(Math.sqrt(H.board.length)), n = H.board.length, win = H.settings.win;
  // Abgelehnte Fotos werden entfernt – das Feld ist wieder frei für ein neues Foto
  const rejIds = checked.filter(f => H.findings[f] && !isValid(H, f));
  for (const f of rejIds) {
    const fd = H.findings[f];
    hostSendTo(fd.pid, {t:'event', text:'Dein Foto für „' + H.board[fd.cell] + '“ wurde abgelehnt – das Feld ist wieder frei, mach ein neues Foto.', color:'#ff5d6c'});
    delete H.findings[f]; delete H.votes[f]; delete H.reviewed[f]; delete S.images[f];
  }
  const rejected = rejIds.length;
  const rejTxt = rejected ? rejected + ' Foto' + (rejected === 1 ? ' wurde' : 's wurden') + ' abgelehnt.' : '';
  // Gewinner nach der Prüfung?
  const res = sides(H).map(sd => { const c = claimed(H, sd.id, 'confirmed'); return { sd, c, lc: lineInfo(size, c, layoutOf(H, sd.id)).count }; });
  H.pLineCount = {};
  const winners = win === 'line' ? res.filter(r => r.lc > 0) : win === 'full' ? res.filter(r => r.c.size === n) : [];
  if (winners.length) {
    res.forEach(r => { H.lineCount[r.sd.id] = r.lc; H.pLineCount[r.sd.id] = r.lc; });
    const names = winners.map(r => r.sd.name).join(' & ');
    return hostEnd(win === 'line' ? 'BINGO bestätigt! ' + names + (winners.length > 1 ? ' haben' : ' hat') + ' eine volle Reihe!' : names + (winners.length > 1 ? ' haben' : ' hat') + ' die volle Karte!', winners.length === 1 ? winners[0].sd.color : '#ffb020');
  }
  let bingoMsg = '';
  for (const r of res) {
    if (r.lc > (H.lineCount[r.sd.id] || 0)) bingoMsg = 'BINGO bestätigt für ' + r.sd.name + '! ';
    H.lineCount[r.sd.id] = r.lc; H.pLineCount[r.sd.id] = r.lc;
  }
  if (kind === 'bingo') announce('Kein Bingo – ' + (rejTxt || 'die Reihe ist nicht vollständig.') + ' Weiter geht’s!', '#ff5d6c', true, 'nope');
  else announce(bingoMsg + '▶ Weiter geht’s!' + (rejTxt ? ' ' + rejTxt : ''), '#ffb020', true, bingoMsg ? 'bingo' : 'resume');
  commit();
}

function hostEnd(reason, color) {
  if (H.phase !== 'game' && H.phase !== 'intermission') return;
  if (H.phase === 'intermission' && H.endsAt) H.endsAt += Date.now() - H.pausedAt;
  H.endReason = reason; H.pausedAt = 0;
  const fids = H.settings.voting ? unreviewed() : [];
  H.voteOrder = fids; hostSetVoteIdx(0);
  H.phase = fids.length ? 'vote' : 'results';
  announce(reason, color || '#ffb020', true, 'win');
  commit();
}

function hostToLobby() {
  H.phase = 'lobby'; H.findings = {}; H.votes = {}; H.board = []; H.voteOrder = []; H.voteIdx = 0; H.free = null;
  H.locs = {}; H.reviewed = {}; H.locBatch = 0; H.nextLocAt = 0;
  for (const pid of Object.keys(H.players)) if (!H.players[pid].online) delete H.players[pid];
  S.images = {};
  hostBroadcast({t:'reset'});
  commit();
}

function hostKick(pid) {
  if (pid === S.me.pid) return;
  for (const [cid, p] of Object.entries(connPid)) if (p === pid && cid !== 'self') { S.net.send(cid, {t:'kicked'}); S.net.close(cid); delete connPid[cid]; }
  delete H.players[pid]; commit();
}

setInterval(() => {
  if (S.isHost && H && H.phase === 'draft' && H.draftEnds && Date.now() >= H.draftEnds) return hostFinishDraft();
  if (!S.isHost || !H || H.phase !== 'game') return;
  if (H.endsAt && Date.now() >= H.endsAt) return hostEnd('⏰ Die Zeit ist abgelaufen!');
  if (H.nextLocAt && Date.now() >= H.nextLocAt) {
    giveBatch();
    H.nextLocAt += H.settings.locEvery * 60000;
    if ((H.endsAt && H.nextLocAt >= H.endsAt) || (H.settings.maxLocs && H.locBatch >= H.settings.maxLocs)) H.nextLocAt = 0;
    announce('🗺 Neue Auswahl: Wähle deinen ' + H.locBatch + '. Ort!', '#35c873', true, 'loc');
    commit();
  }
}, 500);

/* ============================================================
   Client
   ============================================================ */
function joinGame(code, name, opts = {}) {
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 5) { S.err = 'Der Code hat 5 Zeichen.'; return render(); }
  S.me.name = name; store.set('name', name);
  S.isHost = false; S.code = code; S.view = 'connecting'; S.err = ''; render();
  S.net = createClientNet(code, {
    onOpen() { const a = account(); S.net.send({t:'hello', pid:S.me.pid, sec:S.me.sec, name, acct: a ? a.uid : null, avatar: myAvatar()}); location.hash = code; },
    onMsg: clientMsg,
    onClose() { if (S.view === 'kicked') return; S.state = null; S.view = 'lost'; render(); },
    onError(e) {
      if (opts.retries > 0) { setTimeout(() => joinGame(code, name, { ...opts, retries: opts.retries - 1 }), 2500); return; }
      S.state = null; S.view = 'home'; S.err = e; render();
    }
  });
}

function clientMsg(msg) {
  if (!msg || typeof msg !== 'object') return;
  switch (msg.t) {
    case 'state': {
      const st = cleanState(msg.state); if (!st) return;
      S.offset = (+msg.now || Date.now()) - Date.now(); S.state = st; render(); break;
    }
    case 'img': {
      const d = okImg(msg.data); if (!d || typeof msg.fid !== 'string' || !SAFE_KEY.test(msg.fid)) return;
      S.images[msg.fid] = d; if (S.state) render(); break;
    }
    case 'reset':
      if (!S.isHost) S.images = {}; break;
    case 'chat':
      if (!msg.m || typeof msg.m !== 'object') return;
      S.chat.push(msg.m); if (S.chat.length > 200) S.chat.shift(); renderChat(); break;
    case 'chathist':
      S.chat = Array.isArray(msg.list) ? msg.list.filter(m => m && typeof m === 'object').slice(-200) : []; renderChat(); break;
    case 'event':
      toast(String(msg.text ?? '').slice(0, 300), typeof msg.color === 'string' && /^#[0-9a-f]{3,8}$/i.test(msg.color) ? msg.color : null, !!msg.big); if (typeof msg.snd === 'string' && Object.hasOwn(SOUNDS, msg.snd)) sfx(msg.snd); break;
    case 'toast':
      toast(String(msg.text ?? '').slice(0, 300), '#ff5d6c'); break;
    case 'kicked':
      S.kickReason = msg.reason || ''; S.state = null; S.view = 'kicked'; render(); break;
    case 'joker':
      S.jokerSwap = msg; break;
  }
}

  $('#teams').innerHTML = teamsHTML(st);
  bindTeams();
  if (amHost() && !st.ranked) syncSettingsForm();
  renderRules(st);
  const hostName = st.players[st.hostPid]?.name || 'Host';
  $('#rulesBy').textContent = st.ranked ? 'feste Online-Einstellungen' : amHost() ? 'So sehen es die anderen' : 'festgelegt von ' + hostName;
  const sa = $('#startArea');
  if (st.ranked) {

  } else if (amHost()) {
    const ps = Object.values(st.players);
    const noTeam = st.settings.mode === 'team' ? ps.filter(p => p.team == null).length : 0;
    const pool = wordPool(st.settings).length, need = st.settings.size ** 2;
    let warn = '';
    if (noTeam) warn = `${noTeam} Spieler ${noTeam === 1 ? 'hat' : 'haben'} noch kein Team.`;
    else if (st.settings.wordMode === 'custom' && pool < need) warn = `Nur ${pool} eigene Begriffe – der Rest wird mit Standardbegriffen aufgefüllt.`;
    sa.innerHTML = `<button class="btn-primary" id="startBtn" ${noTeam ? 'disabled' : ''}>${st.settings.draft ? '🗳 Wort-Draft starten' : '▶ Spiel starten'}</button>

      ${warn ? `<div class="warnline">⚠️ ${esc(warn)}</div>` : ''}`;
    $('#startBtn').onclick = hostStart;
    if ($('#shuffleBtn')) $('#shuffleBtn').onclick = () => {
      shuffle(Object.keys(H.players)).forEach((p, i) => H.players[p].team = i % 2); commit();
    };
  } else {
    sa.innerHTML = `<div class="waiting"><span class="wdots"><i></i><i></i><i></i></span>Warte darauf, dass ${esc(hostName)} das Spiel startet</div>`;

};

/* Regeln als Kacheln – für alle Spieler */
function ruleTiles(s) {
  const team = s.mode === 'team';
  const words = s.wordMode === 'std' ? 'Standard' : (s.listName ? '„' + s.listName + '“' : s.wordMode === 'custom' ? 'Eigene Liste' : 'Eigene') + (s.wordMode === 'mix' ? ' + Standard' : '');
  const customN = s.wordMode === 'std' ? 0 : wordPool({...s, wordMode:'custom'}).length;
  const inter = s.voting && s.interEvery;
  return [
    { k:'mode', i:'👥', l:'Modus', v: team ? 'Team gegen Team' : 'Jeder für sich', sub: team ? `${s.teamNames[0]} vs. ${s.teamNames[1]}` : 'Jeder hat eine eigene Karte' },
    { k:'size', i:'🔲', l:'Bingo-Karte', v: `${s.size} × ${s.size}`, sub: `${s.size * s.size} Begriffe · eigene Anordnung pro ${team ? 'Team' : 'Spieler'}` },
    { k:'time', i:'⏱️', l:'Zeit', v: s.minutes ? s.minutes + ' Minuten' : 'Ohne Limit', sub: s.minutes ? 'pro Runde' : 'bis jemand gewinnt' },
    { k:'win', i:'🏆', l:'Sieg', v: s.bingoBonus ? 'Meiste Punkte' : WIN_SHORT[s.win], sub: s.bingoBonus ? `1 Punkt pro Feld, +${BINGO_BONUS} pro Bingo` : s.win === 'line' ? 'Reihe, Spalte oder Diagonale' : s.win === 'full' ? 'alle Felder gefunden' : 'wer bei Zeitende vorne liegt' },
    { k:'draft', i:'🗳️', l:'Wort-Draft', v: s.draft ? 'An' : 'Aus', sub: s.draft ? (s.draftTime ? s.draftTime + ' Sek. zum Abstimmen' : 'bis alle fertig sind') : 'Begriffe werden zufällig gezogen', off: !s.draft },
    { k:'words', i:'📝', l:'Begriffe', v: words, sub: customN ? customN + ' eigene Begriffe' : WORDS.length + ' Begriffe im Topf' },
    { k:'locs', i:'🗺️', l:'Orte', v: `1 aus ${s.locCount} wählen`, sub: s.maxLocs === 1 ? 'ein Ort für die ganze Runde' : `alle ${s.locEvery} Min. ein weiterer · max. ${s.maxLocs || '∞'}` },
    { k:'region', i:'🌍', l:'Gebiet', v: REGION_NAMES[s.region], sub: regionLocs(s.region).length + ' mögliche Orte' },
    { k:'tp', i:'🎯', l:'Teleport', v: s.tpRadius ? String(s.tpRadius).replace('.', ',') + ' km' : 'Aus', sub: s.tpRadius ? 'Umkreis um den Startpunkt' : 'kein Springen möglich', off: !s.tpRadius },
    { k:'mm', i:'🗺️', l:'Minimap', v: s.minimap !== false ? 'An' : 'Aus', sub: s.minimap !== false ? 'Karte rund um den Startpunkt' : 'nur Street View', off: s.minimap === false },
    { k:'vote', i:'✅', l:'Fotos prüfen', v: s.voting ? 'An' : 'Aus', sub: s.voting ? 'die Gegner stimmen ab' : 'alle Fotos zählen', off: !s.voting },
    { k:'inter', i:'⏸️', l:'Zwischenrunde', v: inter ? `nach ${s.interEvery} Fotos` : 'Aus', sub: inter ? 'Zeit pausiert beim Prüfen' : 'nur am Ende prüfen', off: !inter },
    { k:'lock', i:'🔒', l:'Lockout', v: s.lockout ? 'An' : 'Aus', sub: s.lockout ? 'jedes Feld nur einmal' : 'alle Felder für alle offen', off: !s.lockout }
  ];
}
function renderRules(st) {
  const tiles = ruleTiles(st.settings);
  const box = $('#rules'); const prev = S.prevRules; const now = {};
  const inner = t => `<div class="ri" aria-hidden="true">${t.i}</div>
      <div class="rt"><div class="rl">${esc(t.l)}</div><div class="rv">${esc(t.v)}</div><div class="rs">${esc(t.sub || '')}</div></div>`;
  if (!prev || box.children.length !== tiles.length) {
    box.innerHTML = tiles.map(t => `<div class="rtile ${t.off ? 'off' : ''}" data-k="${t.k}">${inner(t)}</div>`).join('');
  } else {
    // Kacheln an Ort und Stelle aktualisieren, damit das Aufleuchten nicht abbricht
    tiles.forEach((t, i) => {
      const el = box.children[i]; const sig = t.v + '|' + t.sub;
      if (prev[t.k] === sig) return;
      el.innerHTML = inner(t); el.classList.toggle('off', !!t.off);
      el.classList.remove('changed'); void el.offsetWidth; el.classList.add('changed');
    });
  }
  tiles.forEach(t => now[t.k] = t.v + '|' + t.sub);
  S.prevRules = now;
}

/* ---------- Spiel ---------- */
/* Street View: mit Schlüssel über die offizielle Maps Embed API (kostenlos, unbegrenzt).
   source=outdoor → nur Google-Außenaufnahmen (keine 360°-Fotos aus Läden/Innenräumen, immer begehbar),
   radius → im Umkreis nach der nächsten Straße suchen. Ohne Schlüssel: alte Einbettung als Rückfall. */
const SV_KEY = '';
const SV_RADIUS = 1000;
function svURL(l) {
  if (SV_KEY) return `https://www.google.com/maps/embed/v1/streetview?key=${encodeURIComponent(SV_KEY)}&location=${l.lat},${l.lng}&heading=${l.h}&pitch=0&fov=90&radius=${SV_RADIUS}&source=outdoor&language=de`;
  return `https://maps.google.com/maps?q=&layer=c&cbll=${l.lat},${l.lng}&cbp=11,${l.h},0,0,0&source=embed&output=svembed`;
}
const allLocs = () => (S.state && S.state.locs && S.state.locs[S.me.pid]) || [];
const myLocs = () => allLocs().filter(l => l.ch);                 // gewählte Orte (bleiben die ganze Runde)
const myOptions = () => allLocs().filter(l => !l.ch && !allLocs().some(x => x.ch && x.b === l.b)); // offene Vorschläge
const MAX_FRAMES = 12; // so viele Street-View-Fenster bleiben gleichzeitig „am Leben“

/* Ort anzeigen – jedes Land hat sein eigenes Street-View-Fenster, das beim Wechseln
   nur versteckt wird. So bleibt der Standort erhalten, wenn man zurückwechselt. */
/* Teleport: zufälliger Punkt im Umkreis (km) um den ursprünglichen Startpunkt */
function teleport() {
  const loc = myLocs().find(l => l.id === S.curLoc); const R = S.state.settings.tpRadius; if (!loc || !R) return;
  const r = R * Math.sqrt(Math.random()), a = Math.random() * 2 * Math.PI;
  const lat = loc.lat + (r * Math.cos(a)) / 111.32;
  const lng = loc.lng + (r * Math.sin(a)) / (111.32 * Math.cos(loc.lat * Math.PI / 180));
  S.tp[loc.id] = { lat: +lat.toFixed(6), lng: +lng.toFixed(6), h: Math.floor(Math.random() * 360) };
  showLoc(loc.id, true);
  renderLocUI();

function topoFeatures(topo, obj) {

  const geom = g => g.type === 'Polygon' ? {type:'Polygon', coordinates:g.arcs.map(ring)}

let capStream = null, capVideo = null;
async function ensureStream() {
  if (capStream && capStream.active) return;
  capStream = await navigator.mediaDevices.getDisplayMedia({ video:{ displaySurface:'browser', frameRate:15 }, audio:false, preferCurrentTab:true, selfBrowserSurface:'include', surfaceSwitching:'exclude' });
  capVideo = document.createElement('video'); capVideo.muted = true; capVideo.playsInline = true; capVideo.srcObject = capStream;
  await capVideo.play();
  capStream.getVideoTracks()[0].addEventListener('ended', () => { capStream = null; });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toJpeg(src, sx, sy, sw, sh) {
  const maxW = 1100; const k = Math.min(1, maxW / sw);
  const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  c.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  let q = 0.78, url = c.toDataURL('image/jpeg', q);
  while (url.length > 420000 && q > 0.35) { q -= 0.1; url = c.toDataURL('image/jpeg', q); }
  return url;
}
async function grabStreetView(crop) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) throw new Error('Dein Browser unterstützt keine Bildschirmaufnahme. Nutze Screenshot + Strg+V.');
  await ensureStream();
  const m = $('#modal'); m.style.visibility = 'hidden';
  await sleep(350);
  try {
    const vw = capVideo.videoWidth, vh = capVideo.videoHeight;
    let sx = 0, sy = 0, sw = vw, sh = vh;
    const kx = vw / innerWidth, ky = vh / innerHeight;
    if (crop && Math.abs(kx - ky) / kx < 0.08) {
      const r = $('#svwrap').getBoundingClientRect();
      sx = Math.max(0, r.left * kx); sy = Math.max(0, r.top * ky); sw = Math.min(vw - sx, r.width * kx); sh = Math.min(vh - sy, r.height * ky);
    }
    return toJpeg(capVideo, sx, sy, sw, sh);
  } finally { m.style.visibility = ''; }
}
async function fileToJpeg(file) {
  const bmp = await createImageBitmap(file);
  return toJpeg(bmp, 0, 0, bmp.width, bmp.height);
}

function thumbHTML(st, fid, f) {

}

      <div class="card rcard" style="--c:${r.color}">
        <div class="rh"><span class="rank">#${r.rank}</span><span class="pill" style="--c:${r.color}">${esc(r.name)}</span>${r.win ? '<span>🏆</span>' : ''}</div>
        ${st.settings.mode === 'team' ? `<div class="muted" style="font-size:13px">${r.members.map(p => esc(st.players[p]?.name)).join(', ') || '–'}</div>` : ''}
        <div class="stats">${st.ranked ? `<div><b>${r.score}</b>Punkte</div>` : ''}<div><b>${r.cells}</b>Felder</div><div><b>${r.lines}</b>Reihen</div><div><b>${Object.values(st.findings).filter(f => f.side === r.id).length}</b>Fotos</div></div>
        <div class="mini words" style="--n:${size};--mfs:${size === 3 ? '13px' : size === 4 ? '11.5px' : '10px'}">${layoutOf(st, r.id).map(i => {
          const w = st.board[i];
          if (i === st.free) return '<span class="f" title="FREI"><i>FREI</i></span>';
          const all = Object.entries(st.findings).filter(([, f]) => f.side === r.id && f.cell === i);
          const okf = all.filter(([fid]) => isValid(st, fid)); const ok = okf.length > 0;
          const img = ok && S.images[okf[okf.length - 1][0]];
          return `<span class="${ok ? 'v' : all.length ? 'x' : ''} ${r.lineCells.has(i) ? 'l' : ''}" ${img ? `style="background-image:url(${img})"` : ''} title="${esc(w)}${ok ? ' – gefunden' : all.length ? ' – abgelehnt' : ''}"${ok ? ` data-zoom="${okf[okf.length - 1][0]}"` : ''}><i>${esc(w)}</i></span>`;
        }).join('')}</div>
      </div>`).join('')}</div>
    <h2>Alle Fotos</h2>
    ${fids.length ? `<div class="gallery">${fids.map(fid => {
      const f = st.findings[fid]; const sd = sideInfo(st, f.side); const ok = isValid(st, fid);
      return `<div class="gitem ${ok ? '' : 'rej'}" data-zoom="${fid}" style="--c:${sd.color}">${S.images[fid] ? `<img src="${S.images[fid]}" alt="">` : '<div style="aspect-ratio:16/10"></div>'}
        <div class="gi"><b>${esc(st.board[f.cell])}</b><span class="muted">${esc(st.players[f.pid]?.name || '?')}</span><span>${ok ? '✅' : '❌'}</span></div></div>`;
    }).join('')}</div>` : '<p class="muted">Keine Fotos in dieser Runde.</p>'}`;
  $$('[data-zoom]').forEach(t => t.onclick = () => lightbox(t.dataset.zoom));
  renderRankedBox();
};

/* ---------- Start ---------- */
addEventListener('beforeunload', e => { if (S.isHost && H && Object.keys(H.players).length > 1) { e.preventDefault(); e.returnValue = ''; } });
handleAuthReturn(); // entfernt Login-Tokens aus der Adresse, bevor die Seite gezeichnet wird
render();
</script>
</body>
</html>
